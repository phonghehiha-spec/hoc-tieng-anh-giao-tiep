<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bữa trưa 20 phút · Học Tiếng Anh Giao Tiếp</title>
  
  <!-- Fonts Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style id="bt20MainStyle">
    :root {
      --ink: #161233;
      --ink2: #221c4a;
      --line: #3a3270;
      --txt: #ece9ff;
      --mut: #a7a1d6;
      --rib: #ff5c8a;
      --mint: #5eead4;
      --sun: #ffd166;
      --bad: #ff7a7a;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--ink);
      color: var(--txt);
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }

    h1, h2, h3, h4, .font-title {
      font-family: 'Baloo 2', 'Be Vietnam Pro', sans-serif;
      line-height: 1.25;
    }

    #app {
      width: 100%;
      max-width: 560px;
      min-height: 100vh;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom)) 16px;
      position: relative;
    }

    /* Lớp phủ mờ phía sau khi mở khung hỏi AI (chạm ra ngoài để đóng) */
    #exBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 24, 0.55);
      backdrop-filter: blur(2px);
      z-index: 998;
    }
    #exBackdrop.open {
      display: block;
    }

    /* Khung hỏi AI cố định bên phải, mặc định luôn ẩn để không che màn hình */
    #ex {
      display: none;
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: auto;
      width: min(380px, 92vw);
      height: 100vh;
      height: 100dvh;
      background: var(--ink2);
      border-left: 2px solid var(--line);
      z-index: 999;
      flex-direction: column;
      box-shadow: -10px 0 30px rgba(0,0,0,0.6);
    }

    #ex.open {
      display: flex;
    }

    /* Trên màn hình máy tính cực rộng (>= 1200px), khi mở thanh AI thì đẩy nhẹ nội dung sang trái để không đè */
    @media (min-width: 1200px) {
      body.ex-open {
        padding-right: 380px;
      }
      body.ex-open #exBackdrop {
        display: none;
      }
    }

    #exToggleBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 26px;
      background: var(--rib);
      color: #fff;
      font-size: 24px;
      border: none;
      box-shadow: 0 4px 14px rgba(255, 92, 138, 0.45);
      cursor: pointer;
      z-index: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    #exToggleBtn:active { transform: scale(0.92); }
    body.ex-open #exToggleBtn {
      display: none;
    }

    /* Nút & Thành phần UI */
    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 18px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: var(--ink2);
      color: var(--txt);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease-out;
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.97);
      filter: brightness(0.95);
    }
    .btn:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 2px;
    }

    .btn.p {
      background: var(--rib);
      border-color: var(--rib);
      color: #120d2b;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(255, 92, 138, 0.35);
    }

    .btn.mint {
      background: var(--mint);
      border-color: var(--mint);
      color: #0d2822;
      font-weight: 700;
    }

    .btn.sun {
      background: var(--sun);
      border-color: var(--sun);
      color: #2b2200;
      font-weight: 700;
    }

    .btn.sm {
      min-height: 34px;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn.full {
      width: 100%;
    }

    .btn.icon-only {
      padding: 0;
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }

    .card {
      background: var(--ink2);
      border: 1.5px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: rgba(34, 28, 74, 0.6);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip[aria-pressed="true"] {
      background: var(--rib);
      border-color: var(--rib);
      color: #120d2b;
    }

    .opt {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--line);
      background: rgba(34, 28, 74, 0.85);
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s;
    }
    .opt.good {
      border-color: var(--mint);
      background: rgba(94, 234, 212, 0.15);
      color: var(--mint);
    }
    .opt.bad {
      border-color: var(--bad);
      background: rgba(255, 122, 122, 0.15);
      color: var(--bad);
      animation: shake 0.3s;
    }

    .tp {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1.5px solid var(--line);
      background: var(--ink2);
      margin-bottom: 12px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tp:hover {
      border-color: var(--mut);
    }

    .cell {
      width: 44px;
      height: 52px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: var(--ink);
      color: var(--sun);
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      outline: none;
      transition: 0.15s;
    }
    .cell:focus {
      border-color: var(--mint);
      box-shadow: 0 0 10px rgba(94, 234, 212, 0.3);
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line);
      background: var(--ink);
      color: var(--txt);
      font-size: 15px;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--mint);
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      min-height: 44px;
    }

    /* Toast */
    #toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--sun);
      color: #1a1500;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Canvas Thiên thạch */
    #meteorCanvas {
      width: 100%;
      height: 400px;
      background: #0d0a21;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      display: block;
      margin-bottom: 12px;
    }

    /* Animation */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .bobbing { animation: bob 1.8s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      *, .bobbing {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Khung nội dung chính -->
  <main id="app" aria-live="polite"></main>

  <!-- Lớp nền mờ chạm để tắt khung AI -->
  <div id="exBackdrop" onclick="closeExDrawer()"></div>

  <!-- Khung giải thích AI bôi đen (aside#ex) -->
  <aside id="ex" aria-hidden="true">
    <div style="padding: 12px 14px; border-bottom: 1.5px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <span style="font-weight:700; color:var(--mint); font-size:15px;">🔍 AI Giải Thích Ngữ Pháp & Từ</span>
      <button type="button" class="btn sm" id="exCloseBtn" onclick="closeExDrawer(event)" aria-label="Đóng khung AI" style="border:1.5px solid var(--bad); color:var(--bad); background:rgba(255,122,122,0.12); font-weight:700; min-height:38px; padding:6px 12px;">✕ Đóng</button>
    </div>
    <div id="exBody" style="flex:1; overflow-y:auto; padding:16px; font-size:14px; line-height:1.6;">
      <p style="color:var(--mut);">💡 Hãy bôi đen bất kỳ từ hoặc câu nào trên màn hình để AI phân tích cấu trúc, nghĩa, thì và cách phát âm chuẩn nhé!</p>
    </div>
    <div style="padding:10px 14px calc(10px + env(safe-area-inset-bottom)) 14px; border-top:1.5px solid var(--line); background:var(--ink);">
      <div style="display:flex; gap:8px;">
        <input type="text" id="exInput" class="input-field" placeholder="Hỏi thêm về từ/câu này..." style="padding:8px 12px; font-size:13px;">
        <button type="button" class="btn sm p" id="exSendBtn">Gửi</button>
      </div>
    </div>
  </aside>

  <!-- Nút mở drawer AI cho màn hình nhỏ hoặc khi đã đóng -->
  <button type="button" id="exToggleBtn" onclick="toggleExDrawer(event)" aria-label="Mở khung hỏi AI">💬</button>

  <!-- Toast toàn cục -->
  <div id="toast" role="status" aria-live="polite"></div>

      VI = {};
      ALL.forEach(w => {
        VI[w[2]] = w[4];
        VI[w[5]] = w[6];

      SENT.forEach(arr => {

        arr.forEach(item => {
          VI[item.q] = item.qVi;

        });
      });
    }
    initVI();

    function link() {
      const u = `${S.topic}:${S.week}`;
      if (!S.pr[u]) S.pr[u] = {};
      S.done = S.pr[u];
    }

    function save() {
      try {
        const copy = Object.assign({}, S);
        delete copy.done;
        localStorage.setItem(ST_KEY, JSON.stringify(copy));
      } catch (e) {
        console.warn("localStorage save failed", e);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(ST_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          S = Object.assign(S, parsed);
          if (Array.isArray(S.keys) && S.keys.length > 0) {
            S.key = S.keys[S.ki] || S.keys[0];
          }
        }
      } catch(e) {
        console.error("Load state failed", e);
      }
      link();
    }

    /* ========================================================
       4. ĐIỀU HƯỚNG MÀN HÌNH & QUẢN LÝ LỊCH SỬ (R, rec, goBack)
       ======================================================== */
    const app = document.getElementById('app');
    let hist = [];
    let alive = 0;

    function rec(key, thunk) {
      if (hist.length > 0 && hist[hist.length - 1].key === key) return;
      hist.push({ key, thunk });
      if (hist.length > 60) hist.shift();
    }

    function home() {
      hist = [];
      alive++;
      window.speechSynthesis && window.speechSynthesis.cancel();
      mainView();
    }

    function goBack() {
      if (hist.length <= 1) {
        home();
        return;
      }
      hist.pop(); // bỏ màn hiện tại
      const prev = hist.pop(); // lấy màn trước
      alive++;
      window.speechSynthesis && window.speechSynthesis.cancel();
      if (prev && typeof prev.thunk === 'function') {
        prev.thunk();
      } else {
        home();
      }
    }

    function R(html, afterRender, noBack) {
      alive++;
      window.speechSynthesis && window.speechSynthesis.cancel();

      let backBar = '';
      if (!noBack && hist.length > 0) {
        backBar = `
          <div class="top-nav">
            <button class="btn sm" id="globalBackBtn" style="gap:6px;">
              <span>←</span> Quay lại
            </button>
            <div style="font-size:13px; color:var(--mut);">Bữa trưa 20 phút</div>
          </div>
        `;
      }

      app.innerHTML = backBar + html;

      const bBtn = document.getElementById('globalBackBtn');
      if (bBtn) {
        bBtn.addEventListener('click', goBack);
      }

      if (typeof afterRender === 'function') {
        try {
          afterRender();
        } catch (e) {
          console.error("Lỗi sau khi vẽ giao diện:", e);
        }
      }
      window.scrollTo(0, 0);
    }

    /* ========================================================
       5. TIỆN ÍCH CƠ BẢN (speak, toast, rich, sh, esc...)
       ======================================================== */
    function toast(text) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = text;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 4500);
    }

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function rich(s) {
      if (!s) return '';
      let res = esc(s);
      res = res.replace(/\*\*(.*?)\*\*/g, '<b style="color:var(--sun)">$1</b>');
      return res.replace(/\n/g, '<br>');
    }

    function sh(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = a[i];
        a[i] = a[j];
        a[j] = temp;
      }
      return a;
    }

    function dayKey(d) {
      const date = d || new Date();
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    // TTS Trình duyệt giọng Mỹ (en-US)
    let voicesCached = [];
    function getVoices() {
      if (voicesCached.length) return voicesCached;
      voicesCached = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return voicesCached;
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = () => {
        voicesCached = window.speechSynthesis.getVoices();
      };
    }

    function speak(text, rate = 0.9, queue = false) {
      if (!window.speechSynthesis || !text) return;
      if (!queue) window.speechSynthesis.cancel();
      setTimeout(() => {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = rate;
          const vs = getVoices().filter(v => v.lang.startsWith('en'));
          if (vs.length > 0) {
            u.voice = vs.find(v => v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')) || vs[0];
          }
          window.speechSynthesis.speak(u);
        } catch(e) {
          console.warn("TTS speak error", e);
        }
      }, 50);
    }

    function speakThen(text, callback, rate = 0.85) {
      if (!window.speechSynthesis || !text) {
        callback && callback();
        return;
      }
      window.speechSynthesis.cancel();
      setTimeout(() => {
        let called = false;
        const done = () => {
          if (!called) {
            called = true;
            clearTimeout(guard);
            callback && callback();
          }
        };
        const guard = setTimeout(done, 4500);
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = rate;
          const vs = getVoices().filter(v => v.lang.startsWith('en'));
          if (vs.length > 0) u.voice = vs[0];
          u.onend = done;
          u.onerror = done;
          window.speechSynthesis.speak(u);
        } catch (e) {
          done();
        }
      }, 70);
    }

    /* ========================================================
       6. TẦNG GEMINI REST API, MULTI-KEY & THINKING TỐI THIỂU
       ======================================================== */
    const DEFAULT_MODEL = 'gemini-3.5-flash-lite';

    function errVi(err) {
      const s = String(err && err.message ? err.message : err);
      if (s.includes('AbortError') || s.includes('signal is aborted')) return 'Phản hồi quá chậm hoặc đường truyền mạng không ổn định.';
      if (s.includes('Failed to fetch') || s.includes('NetworkError')) return 'Không kết nối được tới máy chủ AI. Hãy kiểm tra kết nối mạng và mở trực tiếp trên Chrome/Edge.';
      if (s.includes('API key') || s.includes('key not valid')) return 'API Key không hợp lệ. Vui lòng kiểm tra lại mã khóa Gemini (thường bắt đầu bằng AIza...).';
      if (s.includes('quota') || s.includes('exhaust') || s.includes('429')) return 'Tất cả API Key đều đã hết hạn mức tạm thời. Vui lòng chờ 1 lát hoặc bổ sung key mới.';
      return s;
    }

    // Đổi vòng nhiều API key tự động
    async function kfetch(url, opt = {}) {
      if (!S.keys || S.keys.length === 0) {
        throw new Error('Chưa có Gemini API Key. Vui lòng vào Cài đặt hoặc Phòng Live AI để nhập key.');
      }

      let attempts = 0;
      const totalKeys = S.keys.length;

      while (attempts < totalKeys) {
        const curKey = S.keys[S.ki];
        const headers = Object.assign({}, opt.headers || {}, {
          'x-goog-api-key': curKey,
          'Content-Type': 'application/json'
        });

        try {
          const res = await fetch(url, Object.assign({}, opt, { headers }));
          if (res.ok) {
            S.key = curKey;
            return res;
          }

          // Lỗi quota hoặc key hỏng
          if (res.status === 429 || res.status === 400 || res.status === 403) {
            const errTxt = await res.text();
            if (errTxt.includes('quota') || errTxt.includes('RATE_LIMIT') || errTxt.includes('key not valid')) {
              if (totalKeys > 1) {
                S.kcd[S.ki] = Date.now();
                const oldIdx = S.ki + 1;
                S.ki = (S.ki + 1) % totalKeys;
                toast(`Key ${oldIdx} hết hạn mức, đã tự chuyển sang Key ${S.ki + 1}/${totalKeys}`);
                attempts++;
                continue;
              }
            }
            throw new Error(`Mã lỗi ${res.status}: ${errTxt}`);
          }
          throw new Error(`HTTP Error ${res.status}: ${res.statusText}`);
        } catch (err) {
          if (attempts >= totalKeys - 1) throw err;
          S.ki = (S.ki + 1) % totalKeys;
          attempts++;
        }
      }
      throw new Error('Cả ' + totalKeys + ' key đều đang hết hạn mức hoặc không kết nối được.');
    }

    async function ensureModel() {
      if (!S.model || (!S.mfb && S.model !== DEFAULT_MODEL)) {
        S.model = DEFAULT_MODEL;
      }
      return S.model;
    }

    function thinkList(m) {
      if (/gemini-3/.test(m)) return [{ thinkingLevel: 'minimal' }, { thinkingLevel: 'low' }, null];
      if (/gemini-2\.5/.test(m)) return [{ thinkingBudget: 0 }, null];
      return [null];
    }

    async function gem(body, stream = false) {
      const model = await ensureModel();
      const action = stream ? 'streamGenerateContent?alt=sse' : 'generateContent';
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:${action}`;
      return kfetch(url, {
        method: 'POST',
        body: JSON.stringify(body)
      });
    }

    async function gemJSON(body) {
      const b = Object.assign({}, body);
      if (!b.generationConfig) b.generationConfig = {};
      b.generationConfig.responseMimeType = 'application/json';
      const res = await gem(b, false);
      const data = await res.json();
      let text = '';
      if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
        text = data.candidates[0].content.parts.map(p => p.text || '').join('');
      }
      text = text.trim().replace(/^```json/i, '').replace(/^```/i, '').replace(/```$/, '').trim();
      return JSON.parse(text);
    }

    /* ========================================================
       7. MÃ HÓA ÂM THANH: PCM SANG WAV 16KHZ MONO BASE64
       ======================================================== */
    function pcmWav(float32AudioChunks, inputSampleRate = 44100) {
      // Gộp các mảng Float32
      let totalLen = 0;
      for (let i = 0; i < float32AudioChunks.length; i++) {
        totalLen += float32AudioChunks[i].length;
      }
      const fullPcm = new Float32Array(totalLen);
      let offset = 0;
      for (let i = 0; i < float32AudioChunks.length; i++) {
        fullPcm.set(float32AudioChunks[i], offset);
        offset += float32AudioChunks[i].length;
      }

      // Hạ mẫu xuống 16000 Hz
      const targetRate = 16000;
      const ratio = inputSampleRate / targetRate;
      const newLen = Math.floor(totalLen / ratio);
      const resampled = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const originIdx = Math.floor(i * ratio);
        resampled[i] = fullPcm[originIdx];
      }

      // Tạo file WAV 16-bit Mono (44 byte header)
      const buffer = new ArrayBuffer(44 + newLen * 2);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + newLen * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM format
      view.setUint16(22, 1, true); // Mono
      view.setUint32(24, targetRate, true);
      view.setUint32(28, targetRate * 2, true);
      view.setUint16(32, 2, true); // block align
      view.setUint16(34, 16, true); // 16-bit
      writeString(view, 36, 'data');
      view.setUint32(40, newLen * 2, true);

      // Chuyển Float32 [-1.0, 1.0] sang Int16 [-32768, 32767]
      let p = 44;
      for (let i = 0; i < newLen; i++) {
        let s = Math.max(-1, Math.min(1, resampled[i]));
        view.setInt16(p, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        p += 2;
      }

      // Encode base64 theo từng khối 8192 byte
      const bytes = new Uint8Array(buffer);
      let binary = '';
      const chunkSize = 8192;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const sub = bytes.subarray(i, i + chunkSize);
        binary += String.fromCharCode.apply(null, sub);
      }
      return btoa(binary);
    }

    /* ========================================================
       8. CHẤM PHÁT ÂM VỚI GEMINI
       ======================================================== */
    async function scoreAudio(base64Wav, expectedText) {
      const prompt = `You are a speech pronunciation evaluator for Vietnamese learning American English.
Target sentence/word: "${expectedText}".
Evaluate the user's recorded audio strictly and give helpful feedback in Vietnamese.
Return JSON matching:
{
  "heard": string, // what did you hear them say
  "score": number, // 0 to 100
  "good": string,  // what they did well in Vietnamese
  "fix": string,   // specific phonemes or words to improve with mouth/tongue tips in Vietnamese
  "tip": string    // practical tip to practice in Vietnamese
}`;

      const body = {
        systemInstruction: { parts: [{ text: "You evaluate American English pronunciation. Reply in valid JSON only." }] },
        contents: [{
          role: "user",
          parts: [
            { text: prompt },
            { inlineData: { mimeType: "audio/wav", data: base64Wav } }
          ]
        }],
        generationConfig: {
          temperature: 0.2,
          thinkingConfig: { thinkingLevel: 'minimal' }
        }
      };

      return gemJSON(body);
    }

    function renderPronBox(targetText, containerId) {
      const wrap = document.getElementById(containerId);
      if (!wrap) return;

      wrap.innerHTML = `
        <div style="margin-top:10px; padding:12px; border-radius:14px; background:rgba(22,18,51,0.7); border:1.5px dashed var(--line);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <button class="btn sm" id="${containerId}_recBtn" style="border-color:var(--rib); color:var(--rib);">
              🎤 Chấm phát âm
            </button>
            <span id="${containerId}_status" style="font-size:12px; color:var(--mut);">Chạm để nói câu này</span>
          </div>
          <div id="${containerId}_res" style="margin-top:10px; display:none; font-size:13px;"></div>
        </div>
      `;

      const btn = document.getElementById(`${containerId}_recBtn`);
      const st = document.getElementById(`${containerId}_status`);
      const resBox = document.getElementById(`${containerId}_res`);

      let isRecording = false;
      let audioCtx = null;
      let micStream = null;
      let scriptNode = null;
      let chunks = [];

      btn.onclick = async () => {
        if (!S.keys || S.keys.length === 0) {
          toast("Vui lòng nhập API Key để dùng tính năng AI chấm điểm!");
          aiKeyView();
          return;
        }

        if (isRecording) {
          // Dừng ghi và chấm điểm
          stopRecording();
          return;
        }

        // Bắt đầu ghi
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          micStream = stream;
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const source = audioCtx.createMediaStreamSource(stream);
          scriptNode = audioCtx.createScriptProcessor(2048, 1, 1);
          chunks = [];

          scriptNode.onaudioprocess = (e) => {
            const input = e.inputBuffer.getChannelData(0);
            chunks.push(new Float32Array(input));
          };

          const silentGain = audioCtx.createGain();
          silentGain.gain.value = 0;
          source.connect(scriptNode);
          scriptNode.connect(silentGain);
          silentGain.connect(audioCtx.destination);

          isRecording = true;
          btn.innerHTML = '⏹ Xong, chấm điểm';
          btn.classList.add('p');
          st.textContent = 'Đang nghe bạn nói...';
          resBox.style.display = 'none';

          // Tự dừng sau 10 giây
          setTimeout(() => {
            if (isRecording) stopRecording();
          }, 10000);

        } catch (err) {
          console.error(err);
          st.textContent = 'Không mở được micro: ' + err.message;
        }
      };

      async function stopRecording() {
        if (!isRecording) return;
        isRecording = false;
        btn.innerHTML = '⏳ Đang chấm...';
        btn.classList.remove('p');
        btn.disabled = true;
        st.textContent = 'AI đang phân tích ngữ âm...';

        try {
          if (micStream) micStream.getTracks().forEach(t => t.stop());
          if (scriptNode) scriptNode.disconnect();
          if (audioCtx) await audioCtx.close();

          const base64 = pcmWav(chunks, audioCtx ? audioCtx.sampleRate : 44100);
          const feedback = await scoreAudio(base64, targetText);

          let color = 'var(--bad)';
          if (feedback.score >= 80) color = 'var(--mint)';
          else if (feedback.score >= 60) color = 'var(--sun)';

          resBox.style.display = 'block';
          resBox.innerHTML = `
            <div style="font-size:16px; font-weight:800; color:${color}; margin-bottom:4px;">
              Điểm: ${feedback.score}/100
            </div>
            <div style="color:var(--txt); margin-bottom:4px;">👂 AI nghe: <b>"${esc(feedback.heard)}"</b></div>
            ${feedback.good ? `<div style="color:var(--mint); margin-bottom:2px;">✓ ${esc(feedback.good)}</div>` : ''}
            ${feedback.fix ? `<div style="color:var(--sun); margin-bottom:2px;">⚠️ ${esc(feedback.fix)}</div>` : ''}
            ${feedback.tip ? `<div style="color:var(--mut); font-size:12px;">💡 Mẹo: ${esc(feedback.tip)}</div>` : ''}
          `;
          st.textContent = 'Hoàn thành';
        } catch (e) {
          st.textContent = 'Lỗi: ' + errVi(e);
        } finally {
          btn.innerHTML = '🎤 Chấm lại';
          btn.disabled = false;
        }
      }
    }

    /* ========================================================
       9. KHUNG HỎI AI BÔI ĐEN (aside#ex)
       ======================================================== */
    let lastSelection = '';
    let exTimer = null;
    let suppressSelectionUntil = 0;

    function openExDrawer() {
      document.body.classList.add('ex-open');
      document.body.classList.remove('ex-closed');
      const exEl = document.getElementById('ex');
      const bdEl = document.getElementById('exBackdrop');
      if (exEl) {
        exEl.classList.add('open');
        exEl.setAttribute('aria-hidden', 'false');
      }
      if (bdEl) bdEl.classList.add('open');
    }

    function closeExDrawer(ev) {
      if (ev) {
        ev.preventDefault && ev.preventDefault();
        ev.stopPropagation && ev.stopPropagation();
      }
      clearTimeout(exTimer);
      // Chặn sự kiện selectionchange tự bật lại trên iPad/Safari trong 1.2 giây sau khi bấm đóng
      suppressSelectionUntil = Date.now() + 1200;

      try {
        const sel = window.getSelection();
        if (sel) {
          const curTxt = sel.toString().trim();
          if (curTxt) lastSelection = curTxt;
          sel.removeAllRanges();
        }
      } catch (e) {}

      document.body.classList.remove('ex-open');
      document.body.classList.add('ex-closed');
      const exEl = document.getElementById('ex');
      const bdEl = document.getElementById('exBackdrop');
      if (exEl) {
        exEl.classList.remove('open');
        exEl.setAttribute('aria-hidden', 'true');
      }
      if (bdEl) bdEl.classList.remove('open');
    }

    function toggleExDrawer(ev) {
      if (ev) {
        ev.preventDefault && ev.preventDefault();
        ev.stopPropagation && ev.stopPropagation();
      }
      const exEl = document.getElementById('ex');
      if (exEl && exEl.classList.contains('open')) {
        closeExDrawer();
      } else {
        openExDrawer();
      }
    }

    function initSelectionListener() {
      // Đảm bảo lúc mới khởi động thanh chat luôn ở trạng thái đóng
      closeExDrawer();

      document.addEventListener('selectionchange', () => {
        if (Date.now() < suppressSelectionUntil) return;
        clearTimeout(exTimer);
        exTimer = setTimeout(handleSelection, 700);
      });

      const closeBtn = document.getElementById('exCloseBtn');
      if (closeBtn) {
        closeBtn.onclick = (e) => closeExDrawer(e);
        closeBtn.ontouchend = (e) => closeExDrawer(e);
      }

      const bdEl = document.getElementById('exBackdrop');
      if (bdEl) {
        bdEl.onclick = (e) => closeExDrawer(e);
      }

      const toggleBtn = document.getElementById('exToggleBtn');
      if (toggleBtn) toggleBtn.onclick = (e) => toggleExDrawer(e);

      const sendBtn = document.getElementById('exSendBtn');
      const input = document.getElementById('exInput');
      if (sendBtn && input) {
        sendBtn.onclick = () => sendExCustomQuestion();
        input.onkeydown = (e) => { if (e.key === 'Enter') sendExCustomQuestion(); };
      }
    }

    async function handleSelection() {
      if (Date.now() < suppressSelectionUntil) return;
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;

      const txt = sel.toString().trim();
      if (txt.length < 2 || txt.length > 300 || txt === lastSelection) return;

      // Không phân tích nếu đang gõ input hoặc đang chọn bên trong thanh công cụ/nút bấm
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'BUTTON')) return;

      lastSelection = txt;
      openExDrawer();

      const bodyEl = document.getElementById('exBody');
      bodyEl.innerHTML = `
        <div style="font-weight:700; color:var(--sun); margin-bottom:8px; font-size:16px;">
          Đang phân tích: "${esc(txt)}"
        </div>
        <div style="color:var(--mut);">AI đang suy nghĩ giải thích chi tiết... ⏳</div>
      `;

      if (!S.keys || S.keys.length === 0) {
        bodyEl.innerHTML = `
          <div style="color:var(--bad); margin-bottom:8px;">⚠️ Bạn chưa nhập Gemini API Key</div>
          <p style="font-size:13px; color:var(--mut); margin-bottom:12px;">Hãy thêm API Key để tự động dịch, phân tích ngữ pháp, thì và cách đọc chi tiết của từ này.</p>
          <button class="btn sm p" onclick="aiKeyView()">Nhập API Key</button>
        `;
        return;
      }

      try {
        const prompt = `Phân tích từ hoặc câu sau cho người Việt học tiếng Anh A1:
"${txt}"
Hãy giải thích ngắn gọn, súc tích dưới 200 từ:
1) Nghĩa và ngữ cảnh.
2) Cấu trúc ngữ pháp & Thì đang dùng (nếu là câu).
3) Phiên âm IPA Mỹ & mẹo phát âm từ khó, âm câm hoặc nối âm.
4) Đặt một câu ví dụ tương tự có dịch nghĩa tiếng Việt.`;

        const res = await gem({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { maxOutputTokens: 600, temperature: 0.3 }
        });
        const data = await res.json();
        const ans = data.candidates[0].content.parts[0].text;

        bodyEl.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <b style="color:var(--sun); font-size:15px;">"${esc(txt)}"</b>
            <button class="btn sm" onclick="speak('${esc(txt).replace(/'/g, "\\'")}')">🔊 Nghe</button>
          </div>
          <div style="font-size:13.5px; line-height:1.6;">${rich(ans)}</div>
        `;
      } catch (e) {
        bodyEl.innerHTML = `<div style="color:var(--bad);">Lỗi: ${errVi(e)}</div>`;
      }

    async function sendExCustomQuestion() {
      const input = document.getElementById('exInput');

      if (!val) return;
      input.value = '';

          temp.outerHTML = `<div style="margin-top:4px; font-size:13.5px; line-height:1.6;">${rich(ans)}</div>`;

      } catch (e) {
        const temp = document.getElementById('exAnswerTemp');
        if (temp) temp.innerHTML = `<span style="color:var(--bad)">Lỗi: ${errVi(e)}</span>`;
      }
    }

    /* ========================================================
       10. MÀN HÌNH CHÍNH (MAIN VIEW)

    function mainView() {

                ${curTopic.icon} ${esc(curTopic.name)}
              </span>
              <h2 style="font-size:22px; font-weight:800; color:var(--txt); margin-bottom:4px;">
                Tuần ${S.week}/12: ${esc(curWkTitle)}
              </h2>
            </div>
            <div style="text-align:right;">
              <div style="font-size:24px; font-weight:800; color:var(--sun);">🔥 ${S.streak}</div>

          </p>

        <div style="display:flex; gap:8px; margin-bottom:16px;">
          ${daysHtml}
        </div>

        <!-- Nút CTA chính bắt đầu bài học -->
        <button class="btn p full" style="font-size:17px; min-height:54px; margin-bottom:14px;" onclick="startDay(${nextDay})">
          🚀 Bắt đầu bài học trưa nay (Ngày ${nextDay})
        </button>

        ${recentHtml}

        <!-- Hàng nút chức năng chính -->
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">

          </button>

          </button>

          <button class="btn sm" onclick="aiKeyView()">⚙️ API Key (${S.keys.length})</button>
          <button class="btn sm mint" onclick="githubPushView()">🐙 Đẩy lên GitHub</button>

    /* ========================================================
       11. LỘ TRÌNH 12 TUẦN & CHỌN CHỦ ĐỀ
       ======================================================== */
    function coursesView() {
      rec('courses', coursesView);
      let list = '';
      TOPICS.forEach(t => {
        let doneWeeks = 0;
        for (let w = 1; w <= 12; w++) {
          const p = S.pr[`${t.id}:${w}`];
          if (p && Object.keys(p).length >= 5) doneWeeks++;
        }

        list += `
          <div class="tp" onclick="roadmapView('${t.id}')">
            <span style="font-size:32px;">${t.icon}</span>
            <div style="flex:1;">
              <div style="font-weight:700; font-size:17px; color:var(--txt);">${esc(t.name)}</div>
              <div style="font-size:13px; color:var(--mut);">${esc(t.desc)}</div>
              <div style="font-size:12px; color:var(--mint); margin-top:4px;">Đã xong ${doneWeeks}/12 tuần</div>
            </div>
            <span>➔</span>
          </div>
        `;
      });

      const html = `
        <h2 style="font-size:22px; font-weight:800; margin-bottom:14px;">📚 7 Chủ đề giao tiếp</h2>
        <p style="font-size:14px; color:var(--mut); margin-bottom:16px;">Mỗi chủ đề kéo dài 3 tháng (12 tuần) giúp bạn tự tin giao tiếp phản xạ rảnh tay.</p>
        ${list}
      `;
      R(html);
    }

    function roadmapView(topicId) {
      rec('roadmap', () => roadmapView(topicId));
      const topic = TOPICS.find(t => t.id === topicId) || TOPICS[0];

      let monthsHtml = '';
      const monthNames = [
        "Tháng 1 · Khởi động (A1: câu đơn 4-7 chữ)",
        "Tháng 2 · Tình huống hằng ngày (A2: câu 6-10 chữ)",
        "Tháng 3 · Hội thoại tự nhiên (B1: phản xạ sâu)"
      ];

      for (let m = 0; m < 3; m++) {
        let weeksGrid = '';
        for (let w = m * 4 + 1; w <= (m + 1) * 4; w++) {
          const wInfo = topic.weeks[w - 1];
          const pr = S.pr[`${topic.id}:${w}`] || {};
          const doneDays = Object.keys(pr).length;
          const isCur = (S.topic === topic.id && S.week === w);

          let tag = `<span style="font-size:12px; color:var(--mut);">Chưa học</span>`;
          if (doneDays >= 5) tag = `<span style="font-size:12px; color:var(--mint); font-weight:700;">✓ Hoàn thành</span>`;
          else if (isCur) tag = `<span style="font-size:12px; color:var(--sun); font-weight:700;">Đang học (${doneDays}/5)</span>`;
          else if (doneDays > 0) tag = `<span style="font-size:12px; color:var(--mut);">${doneDays}/5 ngày</span>`;

          weeksGrid += `
            <div class="card" onclick="openWeek('${topic.id}', ${w})" style="cursor:pointer; margin-bottom:10px; ${isCur ? 'border-color:var(--rib);' : ''}">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <b style="font-size:15px; color:var(--txt);">Tuần ${w}: ${esc(wInfo[0])}</b>
                ${tag}
              </div>
              <div style="font-size:13px; color:var(--mut); margin-top:4px;">${esc(wInfo[1])}</div>
            </div>
          `;
        }

        monthsHtml += `
          <div style="margin-bottom:20px;">
            <div style="font-weight:700; color:var(--sun); font-size:15px; margin-bottom:10px;">${monthNames[m]}</div>
            ${weeksGrid}
          </div>
        `;
      }

      const html = `
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
          <span style="font-size:28px;">${topic.icon}</span>
          <h2 style="font-size:22px; font-weight:800;">${esc(topic.name)}</h2>
        </div>
        <p style="font-size:13.5px; color:var(--mut); margin-bottom:16px;">Chọn một tuần để học ngay. Dữ liệu các tuần tiếp theo sẽ được Gemini tự động biên soạn chuẩn trình độ.</p>
        ${monthsHtml}
      `;
      R(html);
    }

    async function openWeek(topicId, weekNum) {
      S.topic = topicId;
      S.week = weekNum;
      S.ts = Date.now();
      link();
      save();

      // Tuần 1 Âm nhạc luôn có sẵn offline
      if (topicId === 'music' && weekNum === 1) {
        D = W1_DAYS;
        ALL = D.flat();
        SENT = W1_SENT;
        DRILL = W1_DRILL;
        initVI();
        mainView();
        return;
      }

      // Kiểm tra cache bài học cục bộ
      const cacheKey = `${topicId}:${weekNum}`;
      let cached = null;
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          cached = parsed[cacheKey];
        }
      } catch (e) {}

      if (cached) {
        loadWeekData(cached);
        mainView();
        return;
      }

      // Chưa có trong cache -> Yêu cầu Gemini tạo
      if (!S.keys || S.keys.length === 0) {
        toast("Tuần này cần kết nối Gemini để tạo bài học. Hãy nhập API key nhé!");
        aiKeyView();
        return;
      }

      genWeekLoadingView(topicId, weekNum);
    }

    function loadWeekData(data) {
      D = data.D;
      ALL = D.flat();
      SENT = data.SENT;
      DRILL = data.DRILL;
      initVI();
    }

    /* ========================================================
       12. TỰ ĐỘNG TẠO BÀI HỌC VỚI GEMINI CHO CÁC TUẦN SAU
       ======================================================== */
    async function genWeekLoadingView(topicId, weekNum) {
      const topic = TOPICS.find(t => t.id === topicId) || TOPICS[0];
      const wInfo = topic.weeks[weekNum - 1];

      const html = `
        <div style="text-align:center; padding:30px 10px;">
          <div style="font-size:48px; margin-bottom:16px;" class="bobbing">🤖</div>
          <h2 style="font-size:22px; font-weight:800; margin-bottom:8px;">Đang chuẩn bị bài học...</h2>
          <p style="color:var(--mut); font-size:14px; margin-bottom:20px;">Tuần ${weekNum}: ${esc(wInfo[0])}</p>
          
          <div class="card" style="text-align:left; font-size:14px; line-height:1.7;">
            <div id="genStep1" style="color:var(--sun);">⏳ Bước 1: Đang tạo 30 từ vựng cho 3 ngày...</div>
            <div id="genStep2" style="color:var(--mut);">⭕ Bước 2: Đang tạo câu ghép và câu hỏi thực tế...</div>
          </div>

          <button class="btn full" onclick="home()" style="margin-top:16px;">Hủy bỏ</button>
        </div>
      `;

      R(html, null, true);

      try {
        // Cuộc gọi A: 30 từ vựng cho 3 ngày
        const promptA = `Create 30 English vocabulary words for Vietnamese beginners for:
Topic: ${topic.en} (${topic.name}).
Week ${weekNum}: ${wInfo[0]} - Focus: ${wInfo[1]}.
Notes: ${topic.note}.
Generate exactly 3 days, each day 10 unique words.
Each word:
- "en": one single english word in lowercase (letters only, length 2 to 12).
- "vi": short natural vietnamese meaning.
- "ipa": standard American IPA.
- "phrase": short natural phrase 2-5 words CONTAINING the word.
- "phraseVi": vietnamese translation of phrase.
- "sentence": natural 4-10 words sentence containing the word.
- "sentenceVi": vietnamese translation of sentence.

Return JSON matching schema:
{
  "days": [
    { "words": [ { "en": string, "vi": string, "ipa": string, "phrase": string, "phraseVi": string, "sentence": string, "sentenceVi": string } ] }
  ]
}`;

        const resA = await gemJSON({
          contents: [{ role: 'user', parts: [{ text: promptA }] }],
          generationConfig: { temperature: 0.3 }
        });

        document.getElementById('genStep1').innerHTML = '✓ Bước 1: 30 từ vựng đã sẵn sàng!';
        document.getElementById('genStep1').style.color = 'var(--mint)';
        document.getElementById('genStep2').innerHTML = '⏳ Bước 2: Đang tạo câu ghép và hỏi đáp...';
        document.getElementById('genStep2').style.color = 'var(--sun)';

        // Cuộc gọi B: Câu ghép và Hỏi đáp
        const promptB = `Based on the topic ${topic.name} and focus "${wInfo[1]}", create:
1) Day 4: 3 practical natural sentences (3-12 words).
2) Day 5: 3 practical natural sentences (3-12 words).
3) Day 4 Q&A: exactly 2 items { "q": string, "qVi": string, "a": string, "aVi": string, "wrong": [ {"en": string, "vi": string}, {"en": string, "vi": string} ] }.
4) Day 5 Q&A: exactly 2 items { "q": string, "qVi": string, "a": string, "aVi": string, "wrong": [ {"en": string, "vi": string}, {"en": string, "vi": string} ] }.

Return JSON matching schema:
{
  "sent4": [string, string, string],
  "sent5": [string, string, string],
  "drill4": [ { "q": string, "qVi": string, "a": string, "aVi": string, "wrong": [ {"en": string, "vi": string}, {"en": string, "vi": string} ] } ],
  "drill5": [ { "q": string, "qVi": string, "a": string, "aVi": string, "wrong": [ {"en": string, "vi": string}, {"en": string, "vi": string} ] } ]
}`;

        const resB = await gemJSON({
          contents: [{ role: 'user', parts: [{ text: promptB }] }],
          generationConfig: { temperature: 0.3 }
        });

        // Chuẩn hóa dữ liệu cấu trúc
        const compiledD = resA.days.map(d => d.words.map(w => [
          w.en.toLowerCase().trim(),
          w.vi.trim(),
          w.phrase.trim(),
          w.ipa.trim(),
          w.phraseVi.trim(),
          w.sentence.trim(),
          w.sentenceVi.trim()
        ]));

        const compiledDrill = [
          resB.drill4.map(it => ({
            q: it.q, qVi: it.qVi, a: it.a, aVi: it.aVi,
            w: it.wrong.map(x => x.en)
          })),
          resB.drill5.map(it => ({
            q: it.q, qVi: it.qVi, a: it.a, aVi: it.aVi,
            w: it.wrong.map(x => x.en)
          }))
        ];

        const compiledData = {
          D: compiledD,
          SENT: [resB.sent4, resB.sent5],
          DRILL: compiledDrill
        };

        // Lưu vào localStorage['bt20c']
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          const cacheObj = raw ? JSON.parse(raw) : {};
          cacheObj[`${topicId}:${weekNum}`] = compiledData;
          localStorage.setItem(CACHE_KEY, JSON.stringify(cacheObj));
        } catch (e) {}

        loadWeekData(compiledData);
        toast("Tạo bài học tuần mới thành công!");
        mainView();

      } catch (err) {
        console.error(err);
        R(`
          <div style="text-align:center; padding:30px 10px;">
            <div style="font-size:42px; margin-bottom:12px;">⚠️</div>
            <h3 style="color:var(--bad); margin-bottom:8px;">Chưa tạo được bài học</h3>
            <p style="font-size:14px; color:var(--mut); margin-bottom:16px;">${errVi(err)}</p>
            <div style="display:flex; flex-direction:column; gap:10px;">
              <button class="btn p full" onclick="openWeek('${topicId}', ${weekNum})">Thử lại</button>
              <button class="btn full" onclick="aiKeyView()">Kiểm tra lại API Key</button>
              <button class="btn full" onclick="home()">Quay về trang chính</button>
            </div>
          </div>
        `);
      }
    }

    /* ========================================================
       13. LUỒNG HỌC HÀNG NGÀY (NGÀY 1-3 & NGÀY 4-5)
       ======================================================== */
    function startDay(dayNum) {
      if (dayNum >= 1 && dayNum <= 3) {
        // Ngày 2 và 3: Có thể ôn nhanh thiên thạch bài cũ
        if (dayNum > 1) {
          quickReviewPrompt(dayNum);
        } else {
          learnCardsView(dayNum, 0);
        }
      } else {
        // Ngày 4 và 5: Ghép câu & Hỏi đáp
        buildSentenceView(dayNum, 0);
      }
    }

    function quickReviewPrompt(dayNum) {

          <div style="font-size:44px; margin-bottom:14px;">⚡</div>

    /* ========================================================
       15. KIỂM TRA MỞ KHÓA (CHỐT CHẶN 100% ĐÚNG)
       ======================================================== */
    let quizState = {
      day: 1,
      questions: [],
      cur: 0,
      mistakes: []
    };

    function startQuizView(dayNum) {
      const words = sh(D[dayNum - 1]);
      quizState = {
        day: dayNum,
        questions: words,
        cur: 0,
        mistakes: []
      };
      runQuizQuestion();
    }

    function runQuizQuestion() {
      const qWord = quizState.questions[quizState.cur];
      const isListening = (quizState.cur % 2 === 1); // Câu lẻ nghe, câu chẵn nhìn nghĩa

      // Tạo 3 đáp án nhiễu từ các từ trong tuần
      const pool = ALL.filter(w => w[0] !== qWord[0]);
      const distractors = sh(pool).slice(0, 3);
      const options = sh([qWord, ...distractors]);

      if (isListening) {
        speak(qWord[0], 0.9);
      }

      const html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <span style="font-size:13px; color:var(--mut); font-weight:600;">
            Kiểm tra mở khóa · Câu ${quizState.cur + 1}/${quizState.questions.length}
          </span>
          <span style="font-size:12px; color:var(--sun);">Đạt 100% để qua bài</span>
        </div>

        <div class="card" style="text-align:center; padding:20px 14px;">
          ${isListening ? `
            <div style="font-size:14px; color:var(--mut); margin-bottom:8px;">Nghe và chọn từ đúng:</div>
            <button class="btn sun" onclick="speak('${esc(qWord[0]).replace(/'/g, "\\'")}', 0.85)" style="font-size:18px; padding:12px 24px;">
              🔊 Nghe lại
            </button>
          ` : `
            <div style="font-size:14px; color:var(--mut); margin-bottom:4px;">Nghĩa tiếng Việt là:</div>
            <h2 style="font-size:26px; font-weight:800; color:var(--sun);">${esc(qWord[1])}</h2>
          `}
        </div>

        <div style="margin-top:16px;">
          ${options.map(opt => `
            <button class="opt" onclick="checkQuizAnswer(this, '${opt[0]}', '${qWord[0]}')">
              <span style="font-size:17px; font-weight:700;">${esc(opt[0])}</span>
              <span style="font-size:13px; color:var(--mut);">${esc(opt[1])}</span>
            </button>
          `).join('')}
        </div>
      `;

      R(html);
    }

    function checkQuizAnswer(btnEl, selectedWord, correctWord) {
      if (selectedWord === correctWord) {
        btnEl.classList.add('good');
        speak(correctWord, 0.9);
        setTimeout(() => {
          quizState.cur++;
          if (quizState.cur < quizState.questions.length) {
            runQuizQuestion();
          } else {
            // Hết lượt, xem có bị sai câu nào không
            if (quizState.mistakes.length === 0) {
              // 100% Hoàn hảo!
              quizPassedView();
            } else {
              // Làm lại đúng các câu sai
              quizMistakesReviewView();
            }
          }
        }, 550);
      } else {
        btnEl.classList.add('bad');
        const qWord = quizState.questions[quizState.cur];
        if (!quizState.mistakes.some(m => m[0] === qWord[0])) {
          quizState.mistakes.push(qWord);
        }
      }
    }

    function quizMistakesReviewView() {
      const count = quizState.mistakes.length;
      const html = `
        <div style="text-align:center; padding:30px 10px;">
          <div style="font-size:42px; margin-bottom:12px;">⚠️</div>
          <h2 style="font-size:22px; font-weight:800; color:var(--bad); margin-bottom:6px;">Chưa đạt 100%</h2>
          <p style="font-size:14px; color:var(--mut); margin-bottom:20px;">
            Bạn đã chọn sai ${count} từ. Theo quy tắc ghi nhớ sâu, chúng ta chỉ cần làm lại đúng ${count} từ này nhé!
          </p>
          <button class="btn p full" onclick="retryMistakesOnly()">
            Làm lại ${count} từ bị sai ➔

      `;
      R(html);
    }

    function retryMistakesOnly() {
      quizState.questions = sh(quizState.mistakes);
      quizState.mistakes = [];
      quizState.cur = 0;
      runQuizQuestion();
    }

    function quizPassedView() {
      const html = `
        <div style="text-align:center; padding:30px 10px;">

    /* ========================================================
       16. VIẾT LẠI TỪ (3 CHẾ ĐỘ & CHẾ ĐỘ CHÉP LẠI)
       ======================================================== */
    let writeState = {
      day: 1,
      mode: 'missing', // missing | full | both
      list: [],
      idx: 0,
      fails: 0
    };

    function chooseWriteModeView(dayNum) {
      const html = `
        <h2 style="font-size:22px; font-weight:800; margin-bottom:12px;">✍️ Viết lại từ vựng</h2>
        <p style="font-size:14px; color:var(--mut); margin-bottom:20px;">Chọn hình thức luyện gõ phù hợp với bạn hôm nay:</p>

        <div style="display:flex; flex-direction:column; gap:12px;">
          <button class="tp" onclick="startWriteSession(${dayNum}, 'missing')">

    function startWriteSession(dayNum, mode) {
      const words = sh(D[dayNum - 1]);
      writeState = {
        day: dayNum,
        mode: mode,
        list: words,
        idx: 0,
        fails: 0
      };
      runWriteTask();
    }

    function runWriteTask() {
      const w = writeState.list[writeState.idx];
      const word = w[0];
      const isMissingMode = (writeState.mode === 'missing' || (writeState.mode === 'both' && writeState.idx < 10));

      // Ẩn khoảng một nửa số chữ cái ngẫu nhiên
      let mask = [];
      if (isMissingMode) {
        const len = word.length;
        const hideCount = Math.max(1, Math.floor(len / 2));
        let hiddenIndices = new Set();
        while (hiddenIndices.size < hideCount) {
          hiddenIndices.add(Math.floor(Math.random() * len));
        }
        for (let i = 0; i < len; i++) {
          mask.push(hiddenIndices.has(i) ? null : word[i]);
        }
      }

      const html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:13px; color:var(--mut); font-weight:600;">
            Viết từ ${writeState.idx + 1}/${writeState.list.length}
          </span>
          <button class="btn sm" onclick="speak('${esc(word).replace(/'/g, "\\'")}', 0.85)">🔊 Nghe</button>
        </div>

        <div class="card" style="text-align:center; padding:20px 14px;">
          <div style="font-size:13px; color:var(--mut); margin-bottom:4px;">Nghĩa tiếng Việt:</div>
          <h2 style="font-size:24px; font-weight:800; color:var(--sun); margin-bottom:8px;">${esc(w[1])}</h2>
          <div style="font-size:14px; color:var(--mut); margin-bottom:16px;">/${esc(w[3])}/</div>

          <!-- Ô nhập từ -->
          <div id="writeInputArea" style="display:flex; justify-content:center; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
            ${isMissingMode ? mask.map((ch, idx) => `
              <input type="text" maxlength="1" class="cell" data-idx="${idx}" data-char="${word[idx]}" value="${ch ? ch : ''}" ${ch ? 'disabled style="background:rgba(255,255,255,0.06); color:var(--mut);"' : ''}>
            `).join('') : `
              <input type="text" id="fullWordInput" class="input-field" placeholder="Gõ từ tiếng Anh..." style="font-size:20px; font-weight:700; text-align:center; max-width:280px; letter-spacing:1px;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            `}
          </div>

          <div id="writeMsg" style="min-height:22px; font-size:14px; font-weight:700;"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:14px;">
          <button class="btn" id="hintBtn" onclick="showWriteHint('${esc(word)}')">💡 Gợi ý</button>
          <button class="btn p full" id="submitWriteBtn">Kiểm tra</button>
        </div>
      `;

      R(html, () => {
        if (isMissingMode) {
          const cells = Array.from(document.querySelectorAll('.cell'));
          // Tự động focus ô trống đầu tiên
          const firstEmpty = cells.find(c => !c.value);
          if (firstEmpty) firstEmpty.focus();

          cells.forEach((cell, i) => {
            cell.oninput = (e) => {
              const val = e.target.value.toLowerCase();
              e.target.value = val;
              if (val) {
                // Nhảy sang ô tiếp theo
                const next = cells.slice(i + 1).find(c => !c.disabled);
                if (next) next.focus();
              }
            };
            cell.onkeydown = (e) => {
              if (e.key === 'Backspace' && !cell.value) {
                const prev = cells.slice(0, i).reverse().find(c => !c.disabled);
                if (prev) {
                  prev.focus();
                  prev.value = '';
                }
              }
            };
          });

          document.getElementById('submitWriteBtn').onclick = () => checkMissingAnswer(cells, word);
        } else {
          const inp = document.getElementById('fullWordInput');
          inp.focus();
          inp.onkeydown = (e) => { if (e.key === 'Enter') checkFullWordAnswer(inp.value, word); };
          document.getElementById('submitWriteBtn').onclick = () => checkFullWordAnswer(inp.value, word);
        }
      });
    }

    function showWriteHint(word) {
      toast(`Gợi ý: Từ có ${word.length} chữ cái, bắt đầu bằng chữ "${word[0].toUpperCase()}"`);
    }

    function checkMissingAnswer(cells, word) {
      const entered = cells.map(c => c.value.toLowerCase()).join('');
      const msg = document.getElementById('writeMsg');
      if (entered === word) {
        handleWriteSuccess(word);
      } else {
        handleWriteFail(word, msg, 3);
      }
    }

    function checkFullWordAnswer(val, word) {
      const clean = val.trim().toLowerCase();
      const msg = document.getElementById('writeMsg');
      if (clean === word) {
        handleWriteSuccess(word);
      } else {
        handleWriteFail(word, msg, 2);
      }
    }

    function handleWriteSuccess(word) {
      const msg = document.getElementById('writeMsg');
      msg.style.color = 'var(--mint)';
      msg.textContent = '✓ Chính xác!';
      writeState.fails = 0;

      const myAlive = alive;
      speakThen(word, () => {
        if (myAlive !== alive) return;
        writeState.idx++;
        if (writeState.idx < writeState.list.length) {
          runWriteTask();
        } else {
          writeFinishedView();
        }
      }, 0.85);
    }

    function handleWriteFail(word, msgEl, maxFails) {
      writeState.fails++;
      msgEl.style.color = 'var(--bad)';
      msgEl.textContent = 'Chưa đúng, hãy thử lại!';

      if (writeState.fails >= maxFails) {
        // Chế độ chép lại đáp án
        msgEl.innerHTML = `<span style="color:var(--sun)">Đáp án là: <b>${word}</b>. Hãy gõ lại chính xác để tiếp tục:</span>`;
        const area = document.getElementById('writeInputArea');
        area.innerHTML = `
          <input type="text" id="copyInput" class="input-field" placeholder="Chép lại đúng chữ: ${word}" style="font-size:18px; text-align:center; max-width:280px;">
        `;
        const copyInp = document.getElementById('copyInput');
        copyInp.focus();
        document.getElementById('submitWriteBtn').onclick = () => {
          if (copyInp.value.trim().toLowerCase() === word) {
            handleWriteSuccess(word);
          } else {
            toast(`Hãy gõ đúng từng chữ: ${word}`);
          }
        };
      }
    }

    function writeFinishedView() {
      const html = `
        <div style="text-align:center; padding:30px 10px;">
          <div style="font-size:48px; margin-bottom:12px;">🌟</div>
          <h2 style="font-size:24px; font-weight:800; color:var(--mint); margin-bottom:6px;">Viết xong toàn bộ từ!</h2>
          <p style="font-size:14px; color:var(--mut); margin-bottom:20px;">
            Trí não đã khắc sâu mặt chữ. Giờ là lúc thử thách phản xạ với Game Thiên Thạch!
          </p>
          <div style="display:flex; flex-direction:column; gap:12px;">
            <button class="btn p full" style="font-size:16px; min-height:50px;" onclick="startMeteorGame(${writeState.day}, false)">
              🎮 Vào Trạm Không Gian (Game Thiên Thạch) ➔
            </button>
            <button class="btn full" onclick="learnSentencesFlow(${writeState.day})">
              📖 Học câu mẫu và kiểm tra ngày này
            </button>
          </div>
        </div>
      `;
      R(html);
    }

    /* ========================================================
       17. GAME THIÊN THẠCH (HTML5 CANVAS, 3 MÁU, mkSeq)
       ======================================================== */
    function mkSeq(pool, newWords) {
      let uniquePool = [];
      newWords.forEach(w => {
        if (!uniquePool.some(x => x[0] === w[0])) uniquePool.push(w);
      });
      const extraNeeded = Math.min(25, pool.length) - uniquePool.length;
      if (extraNeeded > 0) {
        const poolShuffled = sh(pool.filter(w => !uniquePool.some(x => x[0] === w[0])));
        uniquePool.push(...poolShuffled.slice(0, extraNeeded));
      }

      let seq = sh(uniquePool);
      // Thêm 5 từ lặp lại cách xa ít nhất 10 vị trí
      const repeatWords = sh(seq).slice(0, 5);
      repeatWords.forEach(rw => {
        const firstIdx = seq.findIndex(x => x[0] === rw[0]);
        const insertIdx = Math.min(seq.length, firstIdx + 10 + Math.floor(Math.random() * 5));
        seq.splice(insertIdx, 0, rw);
      });

      return seq.slice(0, 30);
    }

    function startMeteorGame(dayNum, isReviewFast = false) {
      rec(`game_${dayNum}`, () => startMeteorGame(dayNum, isReviewFast));
      const myAlive = alive;

      let poolWords = ALL;
      const dayWords = D[dayNum - 1] || D[0];
      const sequence = mkSeq(poolWords, dayWords);

      const html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div id="gameHearts" style="font-size:18px;">❤️❤️❤️</div>
          <div id="gameScore" style="font-size:14px; color:var(--mint); font-weight:700;">Từ: 0/${sequence.length}</div>
          ${isReviewFast ? `<button class="btn sm" onclick="learnCardsView(${dayNum}, 0)">Bỏ qua ôn tập</button>` : ''}
        </div>

        <canvas id="meteorCanvas" width="520" height="400"></canvas>

        <!-- 6 nút chữ cái cảm ứng dưới canvas -->
        <div id="gameKeypad" style="display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; margin-top:8px;"></div>
      `;

      R(html, () => {
        initMeteorEngine(dayNum, sequence, isReviewFast, myAlive);
      });
    }

    function initMeteorEngine(dayNum, sequence, isReviewFast, myAlive) {
      const canvas = document.getElementById('meteorCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let lives = 3;
      let curSeqIdx = 0;
      let activeMeteors = [];
      let lastSpawn = Date.now();
      let animId = null;

      // Tốc độ rơi theo ngày (pixel / giây)
      const speedConfig = [26, 36, 46];
      let fallSpeed = (speedConfig[dayNum - 1] || 32) * (isReviewFast ? 2.0 : 1.0);
      let spawnInterval = (3.4 - (dayNum - 1) * 0.5) * 1000 / (isReviewFast ? 1.8 : 1.0);

      function createMeteor(wordItem) {
        const word = wordItem[0];
        const vi = wordItem[1];

        // Khuyết chữ
        let missingIndices = [];
        if (dayNum === 3) {
          // Khuyết 2 chữ ngẫu nhiên
          while (missingIndices.length < Math.min(2, word.length)) {
            let r = Math.floor(Math.random() * word.length);
            if (!missingIndices.includes(r)) missingIndices.push(r);
          }
        } else {
          // Khuyết nguyên âm đầu hoặc chữ cuối
          let vIdx = word.search(/[aeiou]/i);
          if (vIdx === -1) vIdx = word.length - 1;
          missingIndices.push(vIdx);
        }

        speak(word, 0.9);

        return {
          wordItem,
          word,
          vi,
          x: 50 + Math.random() * (canvas.width - 120),
          y: -30,
          radius: Math.max(28, word.length * 6),
          missingIndices,
          nextMissingPtr: 0,
          speed: fallSpeed + (Math.random() * 8 - 4)
        };
      }

      function updateKeypad() {
        const pad = document.getElementById('gameKeypad');
        if (!pad) return;
        pad.innerHTML = '';

        if (activeMeteors.length === 0) return;

        // Tìm thiên thạch thấp nhất (gần đáy nhất) làm mục tiêu
        const target = activeMeteors.reduce((lowest, m) => (m.y > lowest.y ? m : lowest), activeMeteors[0]);
        const targetChar = target.word[target.missingIndices[target.nextMissingPtr]].toLowerCase();

        // 1 chữ đúng + 5 chữ nhiễu
        const alphabet = 'abcdefghijklmnopqrstuvwxyz';
        let choices = [targetChar];
        while (choices.length < 6) {
          const rand = alphabet[Math.floor(Math.random() * alphabet.length)];
          if (!choices.includes(rand)) choices.push(rand);
        }
        choices = sh(choices);

        choices.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'btn';
          btn.style.padding = '8px 0';
          btn.style.fontSize = '20px';
          btn.style.fontWeight = '800';
          btn.textContent = ch.toUpperCase();
          btn.onclick = () => handleGameCharInput(ch);
          pad.appendChild(btn);
        });
      }

      function handleGameCharInput(ch) {
        if (activeMeteors.length === 0) return;
        const target = activeMeteors.reduce((lowest, m) => (m.y > lowest.y ? m : lowest), activeMeteors[0]);
        const expected = target.word[target.missingIndices[target.nextMissingPtr]].toLowerCase();

        if (ch.toLowerCase() === expected) {
          target.nextMissingPtr++;
          if (target.nextMissingPtr >= target.missingIndices.length) {
            // Nổ thiên thạch!
            speak(target.word, 0.95);
            activeMeteors = activeMeteors.filter(m => m !== target);
          }
          updateKeypad();
        } else {
          // Bấm sai
          toast("Chưa khớp chữ cái!");
        }
      }

      // Nhận cả bàn phím cứng
      const keyHandler = (e) => {
        if (e.key && e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
          handleGameCharInput(e.key);
        }
      };
      window.addEventListener('keydown', keyHandler);

      let lastTime = performance.now();

      function gameLoop(now) {
        if (myAlive !== alive) {
          window.removeEventListener('keydown', keyHandler);
          return;
        }

        const dt = (now - lastTime) / 1000;
        lastTime = now;

        // Sinh thiên thạch mới
        if (now - lastSpawn > spawnInterval && activeMeteors.length < 3 && curSeqIdx < sequence.length) {
          activeMeteors.push(createMeteor(sequence[curSeqIdx]));
          curSeqIdx++;
          lastSpawn = now;
          updateKeypad();
          const scoreEl = document.getElementById('gameScore');
          if (scoreEl) scoreEl.textContent = `Từ: ${curSeqIdx}/${sequence.length}`;
        }

        // Vẽ Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Vạch Trái Đất xanh dưới đáy
        ctx.fillStyle = '#5eead4';
        ctx.fillRect(0, canvas.height - 8, canvas.width, 8);

        // Cập nhật vị trí thiên thạch
        for (let i = activeMeteors.length - 1; i >= 0; i--) {
          const m = activeMeteors[i];
          m.y += m.speed * dt;

          // Vẽ đuôi lửa & Tiếng Việt
          ctx.font = 'bold 13px "Be Vietnam Pro"';
          ctx.fillStyle = '#ffd166';
          ctx.textAlign = 'center';
          ctx.fillText(m.vi, m.x, m.y - m.radius - 8);

          // Thân thiên thạch
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#221c4a';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#3a3270';
          ctx.stroke();

          // Chữ hiển thị trên thân
          let disp = '';
          for (let c = 0; c < m.word.length; c++) {
            const isMissing = m.missingIndices.includes(c);
            const ptr = m.missingIndices.indexOf(c);
            if (isMissing && ptr >= m.nextMissingPtr) {
              disp += '_ ';
            } else {
              disp += m.word[c] + ' ';
            }
          }

          ctx.font = 'bold 15px monospace';
          ctx.fillStyle = '#ece9ff';
          ctx.fillText(disp.trim(), m.x, m.y + 5);

          // Chạm đáy Trái Đất
          if (m.y + m.radius >= canvas.height - 8) {
            lives--;
            activeMeteors.splice(i, 1);
            updateKeypad();
            const hEl = document.getElementById('gameHearts');
            if (hEl) hEl.textContent = '❤️'.repeat(Math.max(0, lives));

            if (lives <= 0) {
              window.removeEventListener('keydown', keyHandler);
              gameOverCountdown(dayNum, isReviewFast);
              return;
            }
          }
        }

        // Kiểm tra chiến thắng
        if (curSeqIdx >= sequence.length && activeMeteors.length === 0) {
          window.removeEventListener('keydown', keyHandler);
          if (isReviewFast) {
            toast("Hoàn thành ôn nhanh bài cũ!");
            learnCardsView(dayNum, 0);
          } else {
            finishDay(dayNum);
          }
          return;
        }

        animId = requestAnimationFrame(gameLoop);
      }

      animId = requestAnimationFrame(gameLoop);
    }

      const html = `

        <div id="wordBank" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px;">
          ${shuffledWords.map((w, i) => `
            <button class="chip" data-idx="${i}" onclick="pickWordToken(this, '${esc(w)}')">${esc(w)}</button>
          `).join('')}
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:20px;">
          <button class="btn" onclick="undoWordToken()">↩ Hoàn tác</button>

      `;

      R(html, () => {
        window._pickedTokens = [];
      });
    }

    function pickWordToken(btnEl, word) {
      if (btnEl.disabled) return;
      btnEl.disabled = true;
      btnEl.style.opacity = '0.3';
      window._pickedTokens = window._pickedTokens || [];
      window._pickedTokens.push({ word, btn: btnEl });
      renderBuiltZone();
    }

    function undoWordToken() {
      if (!window._pickedTokens || window._pickedTokens.length === 0) return;
      const last = window._pickedTokens.pop();
      last.btn.disabled = false;
      last.btn.style.opacity = '1';
      renderBuiltZone();
    }

    function clearBuiltTokens() {
      if (!window._pickedTokens) return;
      window._pickedTokens.forEach(item => {
        item.btn.disabled = false;
        item.btn.style.opacity = '1';
      });
      window._pickedTokens = [];
      renderBuiltZone();
    }

    function renderBuiltZone() {
      const zone = document.getElementById('builtZone');
      if (!zone) return;
      if (!window._pickedTokens || window._pickedTokens.length === 0) {
        zone.innerHTML = `<span style="color:var(--mut); font-size:14px;">Chạm vào các thẻ từ bên dưới để ghép câu...</span>`;
        return;
      }
      zone.innerHTML = window._pickedTokens.map(it => `
        <span class="chip" style="background:var(--rib); color:#120d2b; border-color:var(--rib);">${esc(it.word)}</span>
      `).join('');
    }

    function checkBuiltSentence(target, dayNum, sentIdx) {
      const entered = (window._pickedTokens || []).map(t => t.word).join(' ');
      if (entered === target) {
        speak(target, 0.9);
        toast("Ghép câu chuẩn xác!");
        setTimeout(() => {
          const sGroup = SENT[dayNum - 4];
          if (sentIdx + 1 < sGroup.length) {
            buildSentenceView(dayNum, sentIdx + 1);
          } else {
            // Chuyển sang phần Hỏi đáp của ngày 4 hoặc 5
            drillQAView(dayNum, 0);
          }
        }, 600);
      } else {
        toast("Chưa đúng thứ tự các từ. Hãy thử lại!");
      }
    }

    function drillQAView(dayNum, drillIdx) {
      rec(`drill_${dayNum}_${drillIdx}`, () => drillQAView(dayNum, drillIdx));
      const dGroup = DRILL[dayNum - 4] || DRILL[0];
      const item = dGroup[drillIdx];

      // Đọc câu hỏi
      speak(item.q, 0.85);

      // Tạo 3 lựa chọn trả lời (1 đúng + 2 sai)
      let options = [
        { text: item.a, vi: item.aVi, correct: true },
        { text: item.w[0], vi: VI[item.w[0]] || "Câu trả lời gây nhiễu", correct: false },
        { text: item.w[1], vi: VI[item.w[1]] || "Câu trả lời gây nhiễu", correct: false }
      ];
      options = sh(options);

      const html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span style="font-size:13px; color:var(--mut); font-weight:600;">

          <div style="font-size:13px; color:var(--mut); margin-bottom:4px;">Gia sư hỏi:</div>
          <h3 style="font-size:22px; font-weight:800; color:var(--mint); margin-bottom:4px;">"${esc(item.q)}"</h3>
          <div style="font-size:14px; color:var(--mut); margin-bottom:16px;">${esc(item.qVi)}</div>
        </div>

        <div style="font-size:14px; color:var(--txt); margin-bottom:10px; font-weight:600;">
          Chọn câu đối đáp phù hợp nhất:
        </div>

        <div>
          ${options.map(opt => `
            <button class="opt" onclick="checkDrillAnswer(this, ${opt.correct}, '${esc(opt.text)}', ${dayNum}, ${drillIdx})">
              <span style="font-size:16px; font-weight:700;">${esc(opt.text)}</span>
              <span style="font-size:13px; color:var(--mut);">${esc(opt.vi)}</span>
            </button>
          `).join('')}
        </div>
      `;

      R(html);
    }

    function checkDrillAnswer(btnEl, isCorrect, ansText, dayNum, drillIdx) {
      if (isCorrect) {
        btnEl.classList.add('good');
        speak(ansText, 0.9);
        setTimeout(() => {
          const dGroup = DRILL[dayNum - 4];
          if (drillIdx + 1 < dGroup.length) {
            drillQAView(dayNum, drillIdx + 1);
          } else {
            finishDay(dayNum);
          }

        btnEl.classList.add('bad');
      }
    }

    function finishDay(dayNum) {
      link();
      S.done[dayNum] = 1;

      // Cập nhật streak
      const today = dayKey();
      if (!S.last) {
        S.streak = 1;
      } else {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yKey = dayKey(yesterday);

        if (S.last === yKey) {
          S.streak += 1;
        } else if (S.last !== today) {
          S.streak = 1;
        }
      }
      S.last = today;

      // Log lịch sử học
      const curUnit = `${S.topic}:${S.week}`;
      if (!S.log.some(l => l.d === dayNum && l.t === today && l.u === curUnit)) {
        S.log.push({ d: dayNum, t: today, u: curUnit });
        if (S.log.length > 300) S.log.shift();
      }

      save();
      pushDataDebounced();

      const allDone = (Object.keys(S.done).length >= 5);

      const html = `
        <div style="text-align:center; padding:36px 12px;">
          <div style="font-size:52px; margin-bottom:12px;">🎉</div>
          <h1 style="font-size:28px; font-weight:800; color:var(--mint); margin-bottom:6px;">

            <div style="font-size:32px; font-weight:800; color:var(--sun);">🔥 ${S.streak} Ngày</div>
            <div style="font-size:13px; color:var(--mut);">Chuỗi ngày học liên tiếp</div>
          </div>

          <div style="display:flex; flex-direction:column; gap:12px;">
            ${allDone && S.week < 12 ? `
              <button class="btn p full" style="font-size:16px; min-height:50px;" onclick="nextWeekAction()">
                Sang tuần ${S.week + 1} tiếp theo ▶
              </button>
            ` : ''}
            <button class="btn full" onclick="home()">Quay về trang chính</button>
          </div>
