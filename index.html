            <div id="qBank" style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px;">
              ${parts.map((p, i) => `
                <button class="chip" onclick="pushQWord(this, '${esc(p)}')">${esc(p)}</button>
              `).join('')}
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:16px;">
              <button class="btn sm" onclick="undoQWord()">↩ Hoàn tác</button>
              <button class="btn sm p" onclick="checkQArrange('${esc(w[5])}')">Kiểm tra</button>
            </div>
          `;

          R(html, () => {
            window._qPicked = [];
          });
        }
      }

      window.evalChoice = (btn, ok, full) => {
        if (ok) {
          btn.classList.add('good');
          score++;
          speak(full, 0.9);
        } else {
          btn.classList.add('bad');
        }
        setTimeout(() => {
          cur++;
          if (cur < words.length) runQ();
          else finishQuizResult(score, words.length);
        }, 600);
      };

      window.pushQWord = (btn, word) => {
        if (btn.disabled) return;
        btn.disabled = true;
        btn.style.opacity = '0.3';
        window._qPicked = window._qPicked || [];
        window._qPicked.push({ word, btn });
        renderQZone();
      };

      window.undoQWord = () => {
        if (!window._qPicked || window._qPicked.length === 0) return;
        const last = window._qPicked.pop();
        last.btn.disabled = false;
        last.btn.style.opacity = '1';
        renderQZone();
      };

      function renderQZone() {
        const el = document.getElementById('qZone');
        if (!el) return;
        el.innerHTML = (window._qPicked || []).map(x => `
          <span class="chip" style="background:var(--rib); color:#120d2b; border-color:var(--rib);">${esc(x.word)}</span>
        `).join('');
      }

      window.checkQArrange = (target) => {
        const s = (window._qPicked || []).map(x => x.word).join(' ');
        if (s === target) {
          score++;
          speak(target, 0.9);
          toast("Chính xác!");
        } else {
          toast("Chưa đúng trật tự câu!");
        }
        setTimeout(() => {
          cur++;
          if (cur < words.length) runQ();
          else finishQuizResult(score, words.length);
        }, 700);
      };

      runQ();
    }

    function finishQuizResult(score, total) {
      const html = `
        <div style="text-align:center; padding:30px 10px;">
          <div style="font-size:48px; margin-bottom:10px;">🎯</div>
          <h2 style="font-size:24px; font-weight:800; color:var(--sun); margin-bottom:6px;">Kết quả: ${score}/${total}</h2>
          <p style="font-size:14px; color:var(--mut); margin-bottom:20px;">
            ${score >= 8 ? 'Rất tuyệt vời! Bạn đã làm chủ các mẫu câu của bài học!' : 'Hãy tiếp tục rèn luyện thêm để tăng phản xạ nhé!'}
          </p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <button class="btn p full" onclick="startSentenceQuiz()">Làm lại bài kiểm tra</button>
            <button class="btn full" onclick="practiceHubView()">Quay về Luyện tập</button>
          </div>
        </div>
      `;
      R(html);
    }

    /* ========================================================
       21. DỊCH VIỆT - ANH & ANH - VIỆT (VỚI GEMINI BYOK)
       ======================================================== */
    function startTranslatePractice(direction) {
      const words = sh(getScopeWords()).slice(0, 10);
      let cur = 0;

      function run() {
        const w = words[cur];
        const isViToEn = (direction === 'vi_en');
        const questionText = isViToEn ? w[6] : w[5];
        const answerText = isViToEn ? w[5] : w[6];

        if (!isViToEn) speak(w[5], 0.85);

        const html = `
          <div style="font-size:13px; color:var(--mut); margin-bottom:12px;">
            Dịch câu ${cur + 1}/10 · ${isViToEn ? '🇻🇳 Việt sang Anh 🇬🇧' : '🇬🇧 Anh sang Việt 🇻🇳'}
          </div>

          <div class="card" style="padding:20px; text-align:center;">
            <div style="font-size:13px; color:var(--mut); margin-bottom:6px;">Hãy dịch câu:</div>
            <h3 style="font-size:22px; font-weight:800; color:var(--sun); margin-bottom:12px;">"${esc(questionText)}"</h3>
            ${!isViToEn ? `<button class="btn sm" onclick="speak('${esc(w[5]).replace(/'/g, "\\'")}', 0.85)">🔊 Nghe lại</button>` : ''}
          </div>

          <div style="margin-top:16px;">
            <textarea id="transInput" class="input-field" rows="3" placeholder="Nhập bản dịch của bạn vào đây..." style="resize:none; font-size:15px;"></textarea>
            <div id="transFeedback" style="margin-top:10px; font-size:14px; min-height:22px;"></div>
          </div>

          <div style="display:flex; gap:10px; margin-top:16px;">
            <button class="btn" onclick="toast('Gợi ý: Bắt đầu bằng: ${esc(answerText.slice(0, 5))}...')">💡 Gợi ý</button>
            <button class="btn p full" id="checkTransBtn" onclick="evaluateTranslation('${esc(questionText)}', '${esc(answerText)}', ${isViToEn})">Kiểm tra</button>
          </div>
        `;

        R(html);
      }

      window.evaluateTranslation = async (q, target, isViToEn) => {
        const inp = document.getElementById('transInput');
        const val = inp.value.trim();
        const fb = document.getElementById('transFeedback');
        const btn = document.getElementById('checkTransBtn');

        if (!val) {
          toast("Vui lòng nhập câu trả lời!");
          return;
        }

        btn.disabled = true;
        fb.innerHTML = `<span style="color:var(--sun);">Đang chấm điểm... ⏳</span>`;

        // Chuẩn hóa so sánh cơ bản
        function cleanStr(s) {
          return s.toLowerCase().replace(/[.,!?'"~`]/g, '').replace(/\s+/g, ' ').trim();
        }

        const isExact = (cleanStr(val) === cleanStr(target));

        if (isExact) {
          fb.innerHTML = `<b style="color:var(--mint)">✓ Hoàn hảo! Bản dịch hoàn toàn chính xác!</b>`;
          if (isViToEn) speak(target, 0.9);
          proceed();
          return;
        }

        // Nếu có API Key, nhờ Gemini chấm linh hoạt theo từ đồng nghĩa
        if (S.keys && S.keys.length > 0) {
          try {
            const prompt = `Chấm điểm dịch cho câu tiếng Anh A1:
Câu gốc: "${q}"
Đáp án chuẩn: "${target}"
Người học dịch: "${val}"
Hãy kiểm tra xem câu người học có đúng nghĩa và chấp nhận được không (bỏ qua viết hoa/thường, lỗi dấu câu nhỏ, từ đồng nghĩa).
Trả về JSON đúng cấu trúc:
{
  "ok": boolean,
  "feedback": string // nhận xét ngắn gọn bằng tiếng Việt
}`;
            const res = await gemJSON({
              contents: [{ role: 'user', parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.1 }
            });

            if (res.ok) {
              fb.innerHTML = `<b style="color:var(--mint)">✓ Tuyệt vời! ${esc(res.feedback)}</b>`;
              if (isViToEn) speak(target, 0.9);
            } else {
              fb.innerHTML = `
                <div style="color:var(--bad); font-weight:700;">Chưa chuẩn xác:</div>
                <div style="color:var(--txt); font-size:13px; margin-top:2px;">${esc(res.feedback)}</div>
                <div style="color:var(--sun); font-size:13px; margin-top:4px;">Đáp án mẫu: <b>${esc(target)}</b></div>
              `;
            }
            proceed();
            return;
          } catch (e) {
            console.warn("AI score error", e);
          }
        }

        // Chấm dự phòng không cần mạng/key: tỉ lệ từ trùng lặp
        const wVal = cleanStr(val).split(' ');
        const wTar = cleanStr(target).split(' ');
        let match = 0;
        wVal.forEach(w => { if (wTar.includes(w)) match++; });
        const ratio = match / Math.max(wTar.length, 1);

        if (ratio >= (isViToEn ? 0.8 : 0.6)) {
          fb.innerHTML = `<b style="color:var(--mint)">✓ Tốt! Khá sát nghĩa mẫu: "${esc(target)}"</b>`;
        } else {
          fb.innerHTML = `
            <div style="color:var(--bad); font-weight:700;">Chưa đúng lắm!</div>
            <div style="color:var(--sun); font-size:13px; margin-top:4px;">Đáp án mẫu là: <b>${esc(target)}</b></div>
          `;
        }
        proceed();

        function proceed() {
          btn.textContent = 'Câu tiếp theo ➔';
          btn.disabled = false;
          btn.onclick = () => {
            cur++;
            if (cur < words.length) run();
            else {
              toast("Hoàn thành bài luyện dịch!");
              practiceHubView();
            }
          };
        }
      };

      run();
    }

    function openPresetDialog(idx) {
      playDialogViewer(W1_DIALOGS[idx]);
    }

    async function generateNewDialog() {
      if (!S.keys || S.keys.length === 0) {
        toast("Vui lòng nhập API Key để Gemini tự tạo hội thoại mới!");
        aiKeyView();
        return;
      }

      toast("Gemini đang soạn kịch bản hội thoại tự nhiên... ⏳");

      try {
        const curTopic = TOPICS.find(t => t.id === S.topic) || TOPICS[0];
        const wFocus = curTopic.weeks[S.week - 1] ? curTopic.weeks[S.week - 1][1] : '';

        const prompt = `Create a natural daily life American English conversation between two friends A and B for Vietnamese A1-A2 learners.
Topic: ${curTopic.name}. Focus: "${wFocus}".
Requirements:
- 8 to 10 alternating lines (A starts, then B, etc.).
- Use simple, friendly, authentic spoken vocabulary.
- Return valid JSON matching:
{
  "title": string,
  "titleVi": string,
  "lines": [
    { "who": "A", "en": string, "vi": string },
    { "who": "B", "en": string, "vi": string }
  ]
}`;

        const res = await gemJSON({
          contents: [{ role: 'user', parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.6 }
        });

        res.id = 'dlg_' + Date.now();
        playDialogViewer(res);
      } catch (e) {
        toast("Lỗi tạo hội thoại: " + errVi(e));
      }
    }

    function playDialogViewer(dlgObj) {
      let isPlayingAll = false;
      let playIdx = 0;
      let loopMode = false;
      let currentRate = 0.85;
      let showVietnamese = true;
      const myAlive = alive;

      function render() {
        const isSaved = S.dlg.some(d => d.id === dlgObj.id);

        const html = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <div>
              <h3 style="font-size:20px; font-weight:800; color:var(--sun);">${esc(dlgObj.title)}</h3>
              <div style="font-size:13px; color:var(--mut);">${esc(dlgObj.titleVi || '')}</div>
            </div>
            <button class="btn sm" id="saveDlgBtn" onclick="toggleSaveDialog('${dlgObj.id}')">
              ${isSaved ? '✓ Đã lưu' : '💾 Lưu'}
            </button>
          </div>

          <!-- Trình phát Audio -->
          <div class="card" style="padding:14px; margin-bottom:14px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
              <div style="display:flex; gap:8px;">
                <button class="btn p sm" id="playAllBtn" onclick="togglePlayAll()">
                  ${isPlayingAll ? '⏸ Dừng' : '▶ Nghe cả đoạn'}
                </button>
                <button class="btn sm" id="loopBtn" onclick="toggleLoop()" style="${loopMode ? 'border-color:var(--mint); color:var(--mint);' : ''}">
                  🔁 Lặp
                </button>
              </div>

              <!-- Tốc độ đọc -->
              <div style="display:flex; gap:4px;">
                <button class="chip" aria-pressed="${currentRate === 0.65}" onclick="setPlayRate(0.65)">0.65x</button>
                <button class="chip" aria-pressed="${currentRate === 0.85}" onclick="setPlayRate(0.85)">0.85x</button>
                <button class="chip" aria-pressed="${currentRate === 1.0}" onclick="setPlayRate(1.0)">1.0x</button>
              </div>
            </div>

            <div style="display:flex; justify-content:flex-end; margin-top:8px;">
              <button class="btn sm" onclick="toggleViTrans()" style="border:none; font-size:12px; color:var(--mut);">
                ${showVietnamese ? 'Ẩn nghĩa tiếng Việt' : 'Hiện nghĩa tiếng Việt'}
              </button>
            </div>
          </div>

          <!-- Danh sách các câu thoại -->
          <div id="dlgLinesList" style="display:flex; flex-direction:column; gap:8px;">
            ${dlgObj.lines.map((l, i) => `
              <div class="card dl" id="dlLine_${i}" onclick="playSingleLine(${i})" style="cursor:pointer; margin-bottom:0; padding:12px 14px; border-left:4px solid ${l.who === 'A' ? 'var(--rib)' : 'var(--mint)'};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                  <b style="font-size:13px; color:${l.who === 'A' ? 'var(--rib)' : 'var(--mint)'};">Nhân vật ${l.who}</b>
                  <span style="font-size:12px; color:var(--mut);">🔊 Chạm để nghe</span>
                </div>
                <div style="font-size:15px; font-weight:600; color:var(--txt);">${esc(l.en)}</div>
                ${showVietnamese ? `<div style="font-size:13px; color:var(--mut); margin-top:3px;">${esc(l.vi)}</div>` : ''}
              </div>
            `).join('')}
          </div>
        `;

        R(html);
      }

      window.togglePlayAll = () => {
        if (isPlayingAll) {
          isPlayingAll = false;
          window.speechSynthesis && window.speechSynthesis.cancel();
          render();
        } else {
          isPlayingAll = true;
          playIdx = 0;
          render();
          playStep();
        }
      };

      function playStep() {
        if (!isPlayingAll || myAlive !== alive) return;
        if (playIdx >= dlgObj.lines.length) {
          if (loopMode) {
            playIdx = 0;
            setTimeout(playStep, 1000);
          } else {
            isPlayingAll = false;
            render();
          }
          return;
        }

        // Tô viền câu đang đọc
        document.querySelectorAll('.dl').forEach(el => el.style.borderColor = 'var(--line)');
        const curEl = document.getElementById(`dlLine_${playIdx}`);
        if (curEl) {
          curEl.style.borderColor = 'var(--mint)';
          curEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        const line = dlgObj.lines[playIdx];
        speakLineWithRole(line, currentRate, () => {
          if (!isPlayingAll || myAlive !== alive) return;
          playIdx++;
          setTimeout(playStep, 400);
        });
      }

      window.playSingleLine = (i) => {
        isPlayingAll = false;
        document.querySelectorAll('.dl').forEach(el => el.style.borderColor = 'var(--line)');
        const el = document.getElementById(`dlLine_${i}`);
        if (el) el.style.borderColor = 'var(--mint)';
        speakLineWithRole(dlgObj.lines[i], currentRate);
      };

      function speakLineWithRole(line, rate, onEndCb) {
        if (!window.speechSynthesis) {
          onEndCb && onEndCb();
          return;
        }
        window.speechSynthesis.cancel();
        setTimeout(() => {
          let called = false;
          const done = () => {
            if (!called) {
              called = true;
              clearTimeout(guard);
              onEndCb && onEndCb();
            }
          };
          const guard = setTimeout(done, 5000);
          try {
            const u = new SpeechSynthesisUtterance(line.en);
            u.lang = 'en-US';
            u.rate = rate;
            const vs = getVoices().filter(v => v.lang.startsWith('en'));
            if (line.who === 'A') {
              // Ưu tiên giọng nữ hoặc tăng pitch nhẹ
              u.pitch = 1.1;
              if (vs.length > 0) u.voice = vs.find(v => v.name.includes('Samantha') || v.name.includes('Zira') || v.name.includes('Google')) || vs[0];
            } else {
              // Ưu tiên giọng nam hoặc hạ pitch
              u.pitch = 0.88;
              if (vs.length > 1) u.voice = vs.find(v => v.name.includes('David') || v.name.includes('George')) || vs[1];
            }
            u.onend = done;
            u.onerror = done;
            window.speechSynthesis.speak(u);
          } catch(e) {
            done();
          }
        }, 50);
      }

      window.toggleLoop = () => {
        loopMode = !loopMode;
        render();
      };

      window.setPlayRate = (r) => {
        currentRate = r;
        render();
      };

      window.toggleViTrans = () => {
        showVietnamese = !showVietnamese;
        render();
      };

      window.toggleSaveDialog = (id) => {
        const existIdx = S.dlg.findIndex(d => d.id === id);
        if (existIdx >= 0) {
          S.dlg.splice(existIdx, 1);
          S.dd.push(id);
          toast("Đã xóa khỏi danh sách lưu.");
        } else {
          S.dlg.push(dlgObj);
          if (S.dlg.length > 100) S.dlg.shift();
          toast("Đã lưu hội thoại để nghe ngoại tuyến!");
        }
        save();
        pushDataDebounced();
        render();
      };

      render();
    }

    function removeSavedDialog(id) {
      S.dlg = S.dlg.filter(d => d.id !== id);
      S.dd.push(id);
      save();
      pushDataDebounced();
      toast("Đã xóa hội thoại.");
      renderDialogTabContent();
    }

    let slapCount = 0;
    let okCount = 0;

    function initHandsFreeAI(myAlive) {
      liveAiActive = true;
      liveHist = [];

      const statusEl = document.getElementById('aiLiveStatus');
      const chatBox = document.getElementById('aiChatBox');
      const tutorBubbleText = document.getElementById('tutorBubbleText');
      const userBubbleText = document.getElementById('userBubbleText');

      let isMicMuted = false;
      let isAiSpeaking = false;
      let recordedChunks = [];
      let isUserSpeaking = false;
      let silenceStart = 0;
      let speechStart = 0;
      let noiseFloor = 0.01;

      // Đồng bộ cài đặt
      const modeSel = document.getElementById('aiModeSelect');
      if (modeSel) modeSel.onchange = (e) => { S.lv = e.target.value; save(); };
      const vadSel = document.getElementById('aiVadSelect');
      if (vadSel) vadSel.onchange = (e) => { S.vad = e.target.value; save(); };
      const slapChk = document.getElementById('slapToggle');
      if (slapChk) slapChk.onchange = (e) => { S.slap = e.target.checked; save(); };

      const micBtn = document.getElementById('micToggleBtn');
      if (micBtn) {
        micBtn.onclick = () => {
          isMicMuted = !isMicMuted;
          micBtn.textContent = isMicMuted ? '🎙 Bật Mic' : '🎙 Tắt Mic';
          micBtn.style.color = isMicMuted ? 'var(--mut)' : 'var(--rib)';
          statusEl.textContent = isMicMuted ? 'Micro đang tắt' : 'Đang lắng nghe bạn...';
        };
      }

      const skipBtn = document.getElementById('skipAiVoiceBtn');
      if (skipBtn) {
        skipBtn.onclick = () => {
          window.speechSynthesis && window.speechSynthesis.cancel();
          isAiSpeaking = false;
          statusEl.textContent = 'Mời bạn nói...';
        };
      }

      const hintBtn = document.getElementById('aiHintPhraseBtn');
      if (hintBtn) {
        hintBtn.onclick = () => {
          const sample = W1_SENT[0][Math.floor(Math.random() * W1_SENT[0].length)];
          toast(`Thử nói câu này: "${sample}"`);
        };
      }

      const fbInput = document.getElementById('aiFallbackInput');
      const fbSend = document.getElementById('aiFallbackSendBtn');
      if (fbSend && fbInput) {
        const handleSend = () => {
          const v = fbInput.value.trim();
          if (!v) return;
          fbInput.value = '';
          dispatchUserInput(v, null);
        };
        fbSend.onclick = handleSend;
        fbInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };
      }

      // Khởi động Web Audio VAD
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      }).then(stream => {
        if (!liveAiActive || myAlive !== alive) {
          stream.getTracks().forEach(t => t.stop());
          return;
        }

        liveMicStream = stream;
        liveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = liveAudioCtx.createMediaStreamSource(stream);
        liveScriptNode = liveAudioCtx.createScriptProcessor(2048, 1, 1);

        const silentGain = liveAudioCtx.createGain();
        silentGain.gain.value = 0;
        source.connect(liveScriptNode);
        liveScriptNode.connect(silentGain);
        silentGain.connect(liveAudioCtx.destination);

        statusEl.textContent = 'Mời bạn nói (Rảnh tay)...';

        liveScriptNode.onaudioprocess = (e) => {
          if (!liveAiActive || isMicMuted || isAiSpeaking) return;

          const input = e.inputBuffer.getChannelData(0);
          // Tính RMS âm lượng
          let sum = 0;
          for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
          const rms = Math.sqrt(sum / input.length);

          // Cập nhật mượt noiseFloor
          noiseFloor = noiseFloor * 0.95 + rms * 0.05;
          const thr = Math.max(0.014, noiseFloor * 3.5);

          const now = Date.now();

          if (rms > thr) {
            // Có tiếng nói
            silenceStart = 0;
            if (!isUserSpeaking) {
              speechStart = now;
              isUserSpeaking = true;
              recordedChunks = [];
              statusEl.textContent = 'Bạn đang nói...';
              animateMouth('user', true);
            }
            recordedChunks.push(new Float32Array(input));
          } else {
            // Im lặng
            if (isUserSpeaking) {
              if (silenceStart === 0) silenceStart = now;
              const silenceLimit = (S.vad === 'f' ? 700 : (S.vad === 'm' ? 950 : 1350));

              if (now - silenceStart > silenceLimit) {
                // Đã nói xong!
                isUserSpeaking = false;
                animateMouth('user', false);
                const duration = now - speechStart;

                if (duration > 400 && recordedChunks.length > 2) {
                  // Gửi âm thanh đi xử lý
                  statusEl.textContent = 'Gia sư đang lắng nghe...';
                  const base64 = pcmWav(recordedChunks, liveAudioCtx.sampleRate);
                  dispatchUserInput(null, base64);
                } else {
                  statusEl.textContent = 'Mời bạn nói...';
                }
                recordedChunks = [];
              }
            }
          }
        };

        // Lời chào mở đầu bằng giọng TTS
        const introText = `Hi! I'm ${S.tutor}. How do you feel today?`;
        speakTutorLine(introText);

      }).catch(err => {
        statusEl.textContent = 'Lỗi micro: ' + errVi(err);
      });
    }

    // Hiệu ứng chuyển động miệng nhân vật khi nói
    let mouthIntervals = {};
    function animateMouth(char, start) {
      const el = document.getElementById(char === 'tutor' ? 'tutorMouth' : 'userMouth');
      if (!el) return;
      clearInterval(mouthIntervals[char]);

      if (start) {
        let open = false;
        mouthIntervals[char] = setInterval(() => {
          open = !open;
          el.setAttribute('ry', open ? '5' : '1.5');
        }, 150);
      } else {
        el.setAttribute('ry', '2');
      }
    }

    // Hiệu ứng tát của Gia sư
    function triggerSlapAnimation() {
      if (!S.slap) return;
      const arm = document.getElementById('tutorArm');
      const head = document.getElementById('userHead');
      const blush = document.getElementById('userBlush');
      const slapFx = document.getElementById('slapFx');

      if (!arm || !head) return;

      // 1. Giơ tay lên (140deg trong 260ms)
      arm.style.transition = 'transform 0.26s cubic-bezier(0.2, 0.8, 0.4, 1)';
      arm.style.transform = 'rotate(90deg)';

      setTimeout(() => {
        // 2. Vung tát cực mạnh chạm má (120ms)
        arm.style.transition = 'transform 0.12s ease-in';
        arm.style.transform = 'rotate(185deg)';

        setTimeout(() => {
          // Âm thanh chát tạo bằng Web Audio
          playSlapSound();

          // Đầu người dùng hất sang phải
          head.style.transition = 'transform 0.1s ease-out';
          head.style.transform = 'rotate(24deg) translateX(10px)';
          if (blush) blush.setAttribute('opacity', '1');
          if (slapFx) slapFx.setAttribute('opacity', '1');

          slapCount++;
          const cEl = document.getElementById('slapCounter');
          if (cEl) cEl.textContent = `😵 Bị tát: ${slapCount}`;

          setTimeout(() => {
            // Thu tay về và đầu trả về bình thường
            arm.style.transition = 'transform 0.45s ease-out';
            arm.style.transform = 'rotate(0deg)';
            head.style.transition = 'transform 0.35s ease-out';
            head.style.transform = 'rotate(0deg) translateX(0px)';
            if (blush) blush.setAttribute('opacity', '0');
            if (slapFx) slapFx.setAttribute('opacity', '0');
          }, 350);
        }, 120);
      }, 260);
    }

    // Hiệu ứng Like 👍 khi nói đúng
    function triggerOkAnimation() {
      const okFx = document.getElementById('okFx');
      if (!okFx) return;
      okFx.style.transition = 'none';
      okFx.setAttribute('opacity', '1');
      okFx.setAttribute('transform', 'translate(242, 50)');

      setTimeout(() => {
        okFx.style.transition = 'all 0.8s ease-out';
        okFx.setAttribute('opacity', '0');
        okFx.setAttribute('transform', 'translate(242, 10)');
      }, 50);

      okCount++;
      const cEl = document.getElementById('okCounter');
      if (cEl) cEl.textContent = `👍 Khen ngợi: ${okCount}`;
    }

    // Tạo âm thanh chát bằng Web Audio Noise + HighPass
    function playSlapSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = ctx.sampleRate * 0.12;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.03));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1200;

        noise.connect(filter);
        filter.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    // Gửi văn bản hoặc audio đến Gemini cho Gia sư
    async function dispatchUserInput(textInput, audioBase64) {
      const statusEl = document.getElementById('aiLiveStatus');
      const chatBox = document.getElementById('aiChatBox');
      const userBubbleText = document.getElementById('userBubbleText');

      statusEl.textContent = 'Gia sư đang suy nghĩ... ⏳';

      const curTopic = TOPICS.find(t => t.id === S.topic) || TOPICS[0];
      const curWkTitle = curTopic.weeks[S.week - 1] ? curTopic.weeks[S.week - 1][0] : '';
      const curFocus = curTopic.weeks[S.week - 1] ? curTopic.weeks[S.week - 1][1] : '';

      const sysInstruction = `You are ${S.tutor}, a friendly, cheerful American English tutor for a Vietnamese beginner.
TOPIC: ${curTopic.en}. WEEK THEME: ${curWkTitle}. FOCUS: ${curFocus}.
MODE: ${S.lv === '1' ? 'Mode 1 (Ask, answer sample, short Vietnamese explanation)' : 'Mode 2 (Pure conversation, natural short replies under 14 words)'}.

ALWAYS the very first line of your output must be formatted exactly as:
>> [what you heard the user say] ## [VERDICT]
Where VERDICT is OK (if acceptable, greeting, or minor) or WRONG (if clear mistake in grammar, wrong word, or unintelligible).
Then write your reply on the next lines.`;

      let parts = [];
      if (textInput) {
        parts.push({ text: textInput });
        if (userBubbleText) userBubbleText.textContent = textInput.slice(0, 24);
      } else if (audioBase64) {
        parts.push({ inlineData: { mimeType: 'audio/wav', data: audioBase64 } });
        parts.push({ text: "Listen to my speech and reply." });
      }

      // Đưa vào nội dung gửi
      const contents = [
        ...liveHist,
        { role: 'user', parts }
      ];

      try {
        const res = await gem({
          systemInstruction: { parts: [{ text: sysInstruction }] },
          contents,
          generationConfig: {
            temperature: 0.3,
            maxOutputTokens: S.lv === '1' ? 330 : 160,
            thinkingConfig: { thinkingLevel: 'minimal' }
          }
        });

        const data = await res.json();
        const fullReply = data.candidates[0].content.parts[0].text.trim();

        // Tách dòng đầu: >> heard ## VERDICT
        let lines = fullReply.split('\n');
        let heard = textInput || 'Voice speech';
        let verdict = 'OK';

        if (lines[0].startsWith('>>')) {
          const match = lines[0].match(/>>\s*(.*?)\s*##\s*(OK|WRONG)/i);
          if (match) {
            heard = match[1];
            verdict = match[2].toUpperCase();
          }
          lines.shift(); // Bỏ dòng header
        }

        const replyContent = lines.join('\n').trim();

        // Cập nhật giao diện
        if (userBubbleText) userBubbleText.textContent = heard.slice(0, 24);
        if (chatBox) {
          chatBox.innerHTML += `
            <div style="color:var(--sun); margin-bottom:4px;"><b>Bạn:</b> ${esc(heard)}</div>
            <div style="color:var(--mint); margin-bottom:8px;"><b>Gia sư:</b> ${esc(replyContent)}</div>
          `;
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Kích hoạt phản ứng nhân vật
        if (verdict === 'WRONG') {
          triggerSlapAnimation();
        } else {
          triggerOkAnimation();
        }

        // Lưu lịch sử ngắn 6 lượt
        liveHist.push({ role: 'user', parts: [{ text: heard }] });
        liveHist.push({ role: 'model', parts: [{ text: replyContent }] });
        if (liveHist.length > 12) liveHist = liveHist.slice(-12);

        // Đọc câu tiếng Anh đầu tiên
        const firstLine = replyContent.split('\n')[0].replace(/^(Q:|A:)/i, '').trim();
        speakTutorLine(firstLine);

      } catch (err) {
        statusEl.textContent = 'Lỗi: ' + errVi(err);
      }
    }

    function speakTutorLine(text) {
      const tutorBubbleText = document.getElementById('tutorBubbleText');
      const statusEl = document.getElementById('aiLiveStatus');
      if (tutorBubbleText) tutorBubbleText.textContent = text.slice(0, 24);
      if (statusEl) statusEl.textContent = 'Gia sư đang nói...';

      animateMouth('tutor', true);

      speakThen(text, () => {
        animateMouth('tutor', false);
        if (statusEl) statusEl.textContent = 'Mời bạn nói...';
      }, 0.9);
    }

    async function saveAndValidateKeys() {
      const input = document.getElementById('multiKeyInput');

      if (!input || !btn) return;

      const raw = input.value;
      const keys = Array.from(new Set(raw.split(/[\s,;]+/).map(k => k.trim()).filter(k => k.length > 20)));

      if (keys.length === 0) {
        toast("Vui lòng nhập ít nhất một Gemini API Key!");
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra kết nối Google API... ⏳';

      let validKeys = [];
      for (const k of keys) {
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=1`, {
            headers: { 'x-goog-api-key': k }
          });
          if (res.status === 200 || res.status === 429) {
            validKeys.push(k);
          }
        } catch(e) {}
      }

      btn.disabled = false;
      btn.textContent = 'Kiểm tra & Lưu danh sách Key';

      if (validKeys.length > 0) {
        S.keys = validKeys;
        S.ki = 0;
        S.key = validKeys[0];
        S.kts = Date.now();
        save();
        pushDataDebounced();
        toast(`Đã nhận ${validKeys.length} key hợp lệ!`);
        home();
      } else {
        toast("Tất cả key đều không hợp lệ hoặc lỗi mạng. Vui lòng kiểm tra lại!");
      }
    }

    /* ========================================================
       25. TÀI KHOẢN & ĐỒNG BỘ SUPABASE (RPC HOÀN CHỈNH)
       ======================================================== */
    const SB_SQL = `-- Chạy script này trong SQL Editor của Supabase:
create extension if not exists pgcrypto;

create table if not exists bt_users (
  username text primary key,
  pass text not null,
  data jsonb not null default '{}'::jsonb,
  cache jsonb not null default '{}'::jsonb,
  fails int not null default 0,
  last_fail timestamptz,
  created timestamptz not null default now()
);

create table if not exists bt_tokens (
  token text primary key,
  username text not null references bt_users(username) on delete cascade,
  created timestamptz not null default now()
);

alter table bt_users enable row level security;
alter table bt_tokens enable row level security;
revoke all on bt_users, bt_tokens from anon, authenticated;

create or replace function bt_ping() returns jsonb language sql as $$ select jsonb_build_object('ok', 1) $$;

create or replace function bt_register(u text, p text) returns jsonb
language plpgsql security definer set search_path = public, extensions as $$
declare uu text := lower(trim(coalesce(u, ''))); t text;
begin
  if uu !~ '^[a-z0-9_.-]{3,30}$' then return jsonb_build_object('error','Tên đăng nhập dài 3-30 ký tự, không dấu.','status',400); end if;
  if length(coalesce(p,'')) < 4 then return jsonb_build_object('error','Mật khẩu cần ít nhất 4 ký tự.','status',400); end if;
  if exists (select 1 from bt_users where username = uu) then return jsonb_build_object('error','Tên đăng nhập đã tồn tại.','status',409); end if;
  insert into bt_users(username, pass) values (uu, crypt(p, gen_salt('bf')));
  t := encode(gen_random_bytes(24), 'hex');
  insert into bt_tokens(token, username) values (t, uu);
  return jsonb_build_object('user', uu, 'token', t);
end $$;

create or replace function bt_login(u text, p text) returns jsonb
language plpgsql security definer set search_path = public, extensions as $$
declare uu text := lower(trim(coalesce(u,''))); r bt_users%rowtype; t text;
begin
  select * into r from bt_users where username = uu;
  if found and r.fails >= 5 and r.last_fail > now() - interval '1 minute' then
    return jsonb_build_object('error','Sai quá nhiều lần. Thử lại sau 1 phút.','status',429);
  end if;
  if not found or r.pass <> crypt(coalesce(p,''), r.pass) then
    if found then update bt_users set fails = fails + 1, last_fail = now() where username = uu; end if;
    return jsonb_build_object('error','Sai tên đăng nhập hoặc mật khẩu.','status',401);
  end if;
  update bt_users set fails = 0 where username = uu;
  t := encode(gen_random_bytes(24), 'hex');
  insert into bt_tokens(token, username) values (t, uu);
  return jsonb_build_object('user', uu, 'token', t);
end $$;

create or replace function bt_get(t text) returns jsonb
language plpgsql security definer set search_path = public, extensions as $$
declare r bt_users%rowtype;
begin
  select usr.* into r from bt_users usr join bt_tokens tk on tk.username = usr.username where tk.token = t;
  if not found then return jsonb_build_object('error','Cần đăng nhập lại.','status',401); end if;
  return jsonb_build_object('data', r.data, 'defaultKeys', '[]'::jsonb);
end $$;

create or replace function bt_put(t text, d jsonb) returns jsonb
language plpgsql security definer set search_path = public, extensions as $$
declare un text;
begin
  select username into un from bt_tokens where token = t;
  if un is null then return jsonb_build_object('error','Cần đăng nhập lại.','status',401); end if;
  if d is null or length(d::text) > 1500000 then return jsonb_build_object('error','Dữ liệu quá lớn.','status',413); end if;
  update bt_users set data = d where username = un;
  return jsonb_build_object('ok', 1);
end $$;

grant execute on function bt_ping(), bt_register(text,text), bt_login(text,text), bt_get(text), bt_put(text,jsonb) to anon, authenticated;`;

    async function sbRpc(funcName, params = {}) {
      if (!S.sb || !S.sb.url || !S.sb.key) throw new Error('Chưa thiết lập Supabase');
      const url = `${S.sb.url.replace(/\/+$/, '')}/rest/v1/rpc/${funcName}`;
      const headers = {
        'apikey': S.sb.key,
        'Content-Type': 'application/json'
      };
      if (S.sb.key.startsWith('eyJ')) {
        headers['Authorization'] = `Bearer ${S.sb.key}`;
      }

      const res = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify(params)
      });
      const data = await res.json();
      if (data && data.error) throw new Error(data.error);
      return data;
    }

    function packData() {
      return {
        pr: S.pr,
        topic: S.topic,
        week: S.week,
        ts: S.ts,
        streak: S.streak,
        last: S.last,
        tutor: S.tutor,
        key: S.key,
        keys: S.keys,
        kts: S.kts,
        dlg: S.dlg,
        dd: S.dd,
        log: S.log,
        rv: S.rv
      };
    }

    function mergeData(remote) {
      if (!remote) return;
      // RV lớn hơn thắng tiến độ tuần
      if ((remote.rv || 0) > (S.rv || 0)) {
        S.pr = remote.pr || {};
        S.rv = remote.rv;
      } else if ((remote.rv || 0) === (S.rv || 0)) {
        // Union tiến độ
        for (const k in (remote.pr || {})) {
          if (!S.pr[k]) S.pr[k] = {};
          Object.assign(S.pr[k], remote.pr[k]);
        }
      }

      // Vị trí học mới hơn
      if ((remote.ts || 0) > S.ts) {
        S.topic = remote.topic || S.topic;
        S.week = remote.week || S.week;
        S.ts = remote.ts;
      }

      // Streak
      if (remote.last > S.last || (remote.last === S.last && remote.streak > S.streak)) {
        S.streak = remote.streak;
        S.last = remote.last;
      }

      // Keys
      if ((remote.kts || 0) > S.kts || S.keys.length === 0) {
        if (Array.isArray(remote.keys) && remote.keys.length > 0) {
          S.keys = remote.keys;
          S.kts = remote.kts;
        }
      }

      // Dlg
      if (Array.isArray(remote.dlg)) {
        const ddSet = new Set([...S.dd, ...(remote.dd || [])]);
        S.dd = Array.from(ddSet);
        const map = new Map();
        S.dlg.forEach(d => map.set(d.id, d));
        remote.dlg.forEach(d => { if (!ddSet.has(d.id)) map.set(d.id, d); });
        S.dlg = Array.from(map.values()).slice(-100);
      }

      link();
      save();
    }

    let pushTimer = null;
    function pushDataDebounced() {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(async () => {
        if (!S.token || !S.sb) return;
        try {
          await sbRpc('bt_put', { t: S.token, d: packData() });
        } catch(e) {
          console.warn("Push data error", e);
        }
      }, 600);
    }

       25B. TỰ ĐỘNG ĐẨY FILE LÊN GITHUB & BẬT GITHUB PAGES

    let ghSourceState = {
      mode: 'file', // 'app' (Bữa trưa 20p) | 'file' (Từ Máy / Tải về / Google Drive) | 'gdrive' (Link Google Drive / Dán code)
      fileName: 'index.html',
      targetName: 'index.html',
      rawHtml: '',
      title: '',
      sanitize: true
    };

    function sanitizeExternalHtml(htmlStr) {
      if (!htmlStr) return '';
      let s = String(htmlStr).trim();
      // 1. Bóc bỏ dấu ```html ở đầu và ``` ở cuối nếu copy từ khung chat AI
      s = s.replace(/^```(?:html|htm)?\s*\n?/i, '').replace(/\n?```\s*$/i, '').trim();
      // 2. Loại bỏ thẻ  của các khung xem trước (nguyên nhân chính gây lỗi 504 Gateway Time-out)
      s = s.replace(/]*>/gi, '');
      // 3. Loại bỏ các script proxy trung gian của trình xem trước nếu có
      s = s.replace(/<script\b[^>]*src=["'][^"']*(?:__\/|webcontainer|stackblitz|codesandbox)[^"']*["'][^>]*>\s*<\/script>/gi, '');
      return s;
    }

    function extractHtmlTitle(htmlStr) {
      const m = String(htmlStr || '').match(/<title[^>]*>([\s\S]*?)<\/title>/i);
      return m ? m[1].trim() : '';
    }

    function slugifyRepoName(name) {
      return String(name || '')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd').replace(/Đ/g, 'D')
        .toLowerCase()
        .replace(/\.(html|htm)$/i, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'my-html-web';
    }

    function getActiveHtmlToDeploy() {
      if (ghSourceState.mode === 'app') {
        return buildCleanIndexHtml();
      }
      const raw = ghSourceState.rawHtml || '';
      return ghSourceState.sanitize ? sanitizeExternalHtml(raw) : raw;
    }

    function readUploadedHtmlFileObj(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = String(e.target.result || '');
        ghSourceState.fileName = file.name.endsWith('.html') || file.name.endsWith('.htm') ? file.name : (file.name + '.html');
        ghSourceState.targetName = 'index.html';
        ghSourceState.rawHtml = content;
        ghSourceState.title = extractHtmlTitle(content);

        // Tự động gợi ý tên Repo từ tên file mới chọn
        const savedGh = JSON.parse(localStorage.getItem('bt20_gh') || '{}');
        savedGh.repo = slugifyRepoName(ghSourceState.fileName);
        localStorage.setItem('bt20_gh', JSON.stringify(savedGh));

        toast(`Đã nạp file "${ghSourceState.fileName}" thành công!`);
        githubPushView();
      };
      reader.onerror = () => {
        toast("Không đọc được file này. Hãy thử lại!");
      };
      reader.readAsText(file, 'UTF-8');
    }

    async function fetchGDriveHtml() {
      const inp = document.getElementById('ghGDriveUrlInp');
      const btn = document.getElementById('ghFetchDriveBtn');
      if (!inp || !inp.value.trim()) {
        toast("Vui lòng dán link chia sẻ file HTML từ Google Drive!");
        return;
      }

      const rawUrl = inp.value.trim();
      // Trích xuất FILE_ID từ link Google Drive
      const m = rawUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || rawUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (!m) {
        toast("Link Google Drive không đúng định dạng (cần dạng https://drive.google.com/file/d/FILE_ID/view)!");
        return;
      }

      const fileId = m[1];
      const directDownloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Đang tải...';
      }

      try {
        // Thử tải qua cổng proxy CORS công khai để trình duyệt lấy được nội dung file Drive đã bật chia sẻ công khai
        const endpoints = [
          `https://api.allorigins.win/raw?url=${encodeURIComponent(directDownloadUrl)}`,
          `https://corsproxy.io/?${encodeURIComponent(directDownloadUrl)}`
        ];

        let htmlContent = '';
        for (const ep of endpoints) {
          try {
            const res = await fetch(ep);
            if (res.ok) {
              const txt = await res.text();
              if (txt && (txt.includes('<html') || txt.includes('<!DOCTYPE') || txt.includes('<body') || txt.includes('<script'))) {
                htmlContent = txt;
                break;
              }
            }
          } catch (err) {}
        }

        if (!htmlContent) {
          throw new Error('Không tải trực tiếp được. Hãy đảm bảo file Drive đã bật quyền "Bất kỳ ai có đường liên kết", hoặc chọn tab "📂 Tệp Máy / Drive" để mở trực tiếp từ Google Drive trên máy!');
        }

        const detectedTitle = extractHtmlTitle(htmlContent);
        const suggestedName = detectedTitle ? (slugifyRepoName(detectedTitle) + '.html') : `gdrive-${fileId.slice(0, 6)}.html`;

        ghSourceState.rawHtml = htmlContent;
        ghSourceState.fileName = suggestedName;
        ghSourceState.targetName = 'index.html';
        ghSourceState.title = detectedTitle;

        const savedGh = JSON.parse(localStorage.getItem('bt20_gh') || '{}');
        savedGh.repo = slugifyRepoName(suggestedName);
        localStorage.setItem('bt20_gh', JSON.stringify(savedGh));

        toast("Đã tải thành công file HTML từ Google Drive!");
        githubPushView();
      } catch (e) {
        toast(e.message);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Tải file';
        }
      }
    }

    function downloadCleanHtmlFile() {
      try {
        const cleanHtml = getActiveHtmlToDeploy();
        if (!cleanHtml || !cleanHtml.trim()) {
          toast("Bạn chưa chọn hoặc dán file HTML nào! Hãy chọn file trước nhé.");
          return;
        }
        const downloadName = ghSourceState.mode === 'app' ? 'index.html' : (ghSourceState.targetName || 'index.html');
        const blob = new Blob([cleanHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = downloadName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast(`Đã tải file ${downloadName} sạch về máy!`);
      } catch (e) {
        toast("Lỗi tải file: " + e.message);
      }
    }

    function copyTextSafe(txt, msg) {
      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast(msg || "Đã sao chép vào bộ nhớ tạm!");
      } catch (e) {}
      document.body.removeChild(ta);
    }

    async function executeGithubPush() {
      const token = document.getElementById('ghTokenInp').value.trim();
      let repoInput = document.getElementById('ghRepoInp').value.trim().replace(/^\/+|\/+$/g, '');
      let targetBranch = document.getElementById('ghBranchInp').value.trim() || 'main';
      const btn = document.getElementById('ghPushBtn');
      const stBox = document.getElementById('ghStatusBox');

      const htmlToDeploy = getActiveHtmlToDeploy();
      if (!htmlToDeploy || !htmlToDeploy.trim()) {
        toast("Bạn chưa chọn file HTML từ Máy / Google Drive! Hãy chọn 1 file HTML ở Bước 1 trước nhé.");
        return;
      }

      if (!token) {
        toast("Vui lòng dán GitHub Token (bắt đầu bằng ghp_...) ở Bước 2!");
        return;
      }
      if (!repoInput) {
        toast("Vui lòng nhập tên Repository!");
        return;
      }

      const targetFileName = ghSourceState.mode === 'app' ? 'index.html' : (ghSourceState.targetName || 'index.html');

      btn.disabled = true;
      btn.textContent = 'Đang kết nối GitHub... ⏳';
      stBox.style.display = 'block';
      stBox.innerHTML = `<div style="color:var(--sun);">⏳ Đang xác thực tài khoản GitHub...</div>`;

      const headers = {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      };

      try {
        // 1. Lấy thông tin user từ Token
        const userRes = await fetch('https://api.github.com/user', { headers });
        if (!userRes.ok) {
          throw new Error('Token không hợp lệ hoặc đã hết hạn (Mã ' + userRes.status + ').');
        }
        const userData = await userRes.json();
        const owner = repoInput.includes('/') ? repoInput.split('/')[0] : userData.login;
        const repo = repoInput.includes('/') ? repoInput.split('/')[1] : repoInput;

        stBox.innerHTML += `<div style="color:var(--mint); margin-top:4px;">✓ Xin chào <b>${esc(owner)}</b>! Đang kiểm tra kho chứa <b>${esc(repo)}</b>...</div>`;

        // 2. Kiểm tra kho chứa đã tồn tại chưa, nếu chưa thì tự tạo mới
        let repoCheck = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
        if (repoCheck.status === 404) {
          stBox.innerHTML += `<div style="color:var(--sun); margin-top:4px;">⏳ Kho chứa chưa tồn tại, đang tự động tạo kho chứa công khai <b>${esc(repo)}</b>...</div>`;
          const createRes = await fetch('https://api.github.com/user/repos', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              name: repo,
              description: ghSourceState.title || 'Triển khai tự động từ Trạm đẩy HTML GitHub',
              private: false,
              auto_init: true
            })
          });
          if (!createRes.ok) {
            const errTxt = await createRes.text();
            throw new Error('Không thể tạo kho chứa mới: ' + errTxt);
          }
          const createdRepo = await createRes.json();
          if (createdRepo && createdRepo.default_branch) {
            targetBranch = createdRepo.default_branch;
          }
          await new Promise(r => setTimeout(r, 1500));
        } else if (repoCheck.ok) {
          const existingRepo = await repoCheck.json();
          if (existingRepo && existingRepo.default_branch) {
            targetBranch = existingRepo.default_branch;
          }
        }

        localStorage.setItem('bt20_gh', JSON.stringify({ token, repo, branch: targetBranch }));

        // 3. Kiểm tra xem file đích đã có sẵn chưa để lấy SHA
        stBox.innerHTML += `<div style="color:var(--sun); margin-top:4px;">⏳ Đang đóng gói <code>${esc(targetFileName)}</code> sạch lên nhánh <b>${esc(targetBranch)}</b>...</div>`;
        let fileSha = null;
        const fileCheck = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(targetFileName)}?ref=${encodeURIComponent(targetBranch)}`, { headers });
        if (fileCheck.ok) {
          const fileData = await fileCheck.json();
          fileSha = fileData.sha;
        }

        // 4. Mã hóa nội dung HTML sạch sang Base64 chuẩn UTF-8
        const bytes = new TextEncoder().encode(htmlToDeploy);
        let binary = '';
        const chunkSize = 8192;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        const base64Content = btoa(binary);

        const putBody = {
          message: `Đẩy file ${targetFileName} (từ ${ghSourceState.mode === 'app' ? 'App Bữa trưa 20p' : ghSourceState.fileName})`,
          content: base64Content,
          branch: targetBranch
        };
        if (fileSha) putBody.sha = fileSha;

        const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(targetFileName)}`, {
          method: 'PUT',
          headers,
          body: JSON.stringify(putBody)
        });

        if (!putRes.ok) {
          const errTxt = await putRes.text();
          throw new Error(`Lỗi khi đẩy file ${targetFileName}: ` + errTxt);
        }

        // 5. Tự động bật GitHub Pages
        stBox.innerHTML += `<div style="color:var(--mint); margin-top:4px;">✓ Đã đẩy <code>${esc(targetFileName)}</code> thành công! Đang kích hoạt GitHub Pages...</div>`;
        await fetch(`https://api.github.com/repos/${owner}/${repo}/pages`, {
          method: 'POST',
          headers,
          body: JSON.stringify({
            source: { branch: targetBranch, path: '/' }
          })
        }).catch(() => {});

        const repoUrl = `https://github.com/${owner}/${repo}`;
        const pagesUrl = targetFileName === 'index.html'
          ? `https://${owner}.github.io/${repo}/`
          : `https://${owner}.github.io/${repo}/${encodeURIComponent(targetFileName)}`;
        const instantUrl = `https://raw.githack.com/${owner}/${repo}/${targetBranch}/${encodeURIComponent(targetFileName)}`;

        stBox.innerHTML = `
          <div style="color:var(--mint); font-weight:800; font-size:16px; margin-bottom:10px;">
            🎉 Đã đẩy <code>${esc(targetFileName)}</code> lên GitHub thành công!
          </div>
          <div style="font-size:13px; line-height:1.6;">
            <div style="margin-bottom:10px; padding:10px; background:rgba(94,234,212,0.1); border:1px solid var(--mint); border-radius:10px;">
              ⚡ <b>Link chạy ngay lập tức (0 giây chờ):</b><br>
              <div style="word-break:break-all; color:var(--mint); font-weight:700; margin:4px 0;">${instantUrl}</div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
                <button type="button" class="btn sm mint" onclick="copyTextSafe('${instantUrl}', 'Đã copy Link chạy ngay! Hãy dán vào tab mới của trình duyệt.')">📋 Copy Link chạy ngay</button>
                <a href="${instantUrl}" target="_blank" rel="noopener" class="btn sm">↗ Mở thử</a>
              </div>
            </div>

            <div style="margin-bottom:10px; padding:10px; background:rgba(255,209,102,0.08); border:1px solid var(--line); border-radius:10px;">
              🌐 <b>Link GitHub Pages chính thức (chờ 1-2 phút để GitHub cập nhật):</b><br>
              <div style="word-break:break-all; color:var(--sun); font-weight:700; margin:4px 0;">${pagesUrl}</div>
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
                <button type="button" class="btn sm" onclick="copyTextSafe('${pagesUrl}', 'Đã copy Link GitHub Pages!')">📋 Copy Link GitHub Pages</button>
                <a href="${pagesUrl}" target="_blank" rel="noopener" class="btn sm">↗ Mở trang</a>
              </div>
            </div>

            <div>
              📂 <b>Kho mã nguồn GitHub:</b> <span style="color:var(--mut); word-break:break-all;">${repoUrl}</span>
              <button type="button" class="btn sm" style="margin-top:4px;" onclick="copyTextSafe('${repoUrl}', 'Đã copy Link Repo GitHub!')">📋 Copy Link Repo</button>
            </div>
          </div>
        `;
        toast(`Đã đẩy ${targetFileName} lên GitHub thành công!`);
      } catch (err) {
        stBox.innerHTML = `<div style="color:var(--bad); font-weight:700;">⚠️ Lỗi: ${esc(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Đẩy lên GitHub & Tạo Link Web';
      }
    }

    /* ========================================================
       26. KHỞI TẠO ỨNG DỤNG (BOOT)
       ======================================================== */
    function boot() {
      loadState();

      // Kiểm tra hash import Supabase từ link chia sẻ #sb=...
      const hash = window.location.hash;
      if (hash && hash.startsWith('#sb=')) {
        try {
          const raw = atob(hash.slice(4));
          const parsed = JSON.parse(raw);
          if (parsed.u && parsed.k) {
            S.sb = { url: parsed.u, key: parsed.k };
            save();
            history.replaceState(null, '', window.location.pathname);
            toast("Đã tự động nạp cấu hình đồng bộ từ Link!");
          }
        } catch(e) {}
      }

      // Kích hoạt lắng nghe bôi đen giải thích AI
      initSelectionListener();

      // Nếu chưa có phiên và chưa chọn chế độ khách -> Vào màn đăng nhập
      if (!S.token && !S.guest) {
        loginView();
      } else {
        mainView();
      }
    }

    // Gắn các hàm được gọi từ inline onclick của HTML vào window
    Object.assign(window, {
      guestLogin,
      handleAuthAction,
      loginView,
      setupSupabaseView,
      copySupabaseSql,
      testAndSaveSupabase,
      syncNow,
      shareLink,
      logout,
      coursesView,
      roadmapView,
      openWeek,
      startDay,
      startMeteorGame,
      learnCardsView,
      startQuizView,
      checkQuizAnswer,
      retryMistakesOnly,
      chooseWriteModeView,
      startWriteSession,
      showWriteHint,
      learnSentencesFlow: startSentenceStudy,
      undoWordToken,
      clearBuiltTokens,
      pickWordToken,
      checkBuiltSentence,
      checkDrillAnswer,
      drillQAView,
      nextWeekAction,
      resetWeekConfirm,
      executeResetWeek,
      practiceHubView,
      setPracticeScope,
      startPracticeWrite,
      startSentenceStudy,
      startSentenceQuiz,
      startTranslatePractice,
      dialogsView,
      setDialogTab,
      openPresetDialog,
      generateNewDialog,
      removeSavedDialog,
      aiLiveView,
      aiKeyView,
      saveAndValidateKeys,
      githubPushView,
      setGhSourceMode,
      setGhTargetFileName,
      toggleGhSanitize,
      clearCustomHtmlFile,
      useFileNameAsRepo,
      handleCustomHtmlFile,
      handleManualHtmlInput,
      pasteClipboardHtml,
      fetchGDriveHtml,
      previewSelectedHtml,
      closeHtmlPreviewModal,
      executeGithubPush,
      downloadCleanHtmlFile,
      copyTextSafe,
      openExDrawer,
      closeExDrawer,
      toggleExDrawer,
      speak,
      home,
      goBack
    });

    // Khởi chạy khi DOM sẵn sàng
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }

  })();
  </script>
</body>
